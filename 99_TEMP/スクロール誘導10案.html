<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スクロール誘導アニメーション 10案</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #0d0d0d;
  color: #fff;
  padding: 60px 40px 80px;
}

h1 {
  font-size: 11px;
  letter-spacing: 0.4em;
  color: rgba(255,255,255,0.25);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 60px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
  max-width: 1100px;
  margin: 0 auto;
}

.cell {
  aspect-ratio: 9 / 16;
  background: linear-gradient(160deg, #141414 0%, #1a1a2a 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 40px;
  position: relative;
  overflow: hidden;
}

.cell-num {
  position: absolute;
  top: 16px;
  left: 20px;
  font-size: 9px;
  letter-spacing: 0.25em;
  color: rgba(255,255,255,0.2);
}

.cell-label {
  position: absolute;
  bottom: 14px;
  left: 0; right: 0;
  text-align: center;
  font-size: 8px;
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.2);
}

/* ================================
   案01：光がスーッと落ちる
================================ */
.hint-01 .line {
  width: 1px;
  height: 70px;
  background: rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
}
.hint-01 .line::after {
  content: '';
  position: absolute;
  top: -40%;
  left: 0;
  width: 100%;
  height: 40%;
  background: linear-gradient(to bottom, transparent, #fff 50%, transparent);
  animation: drop 1.8s ease-in-out infinite;
}
@keyframes drop {
  0%   { top: -40%; }
  100% { top: 120%; }
}

/* ================================
   案02：シェブロン連続
================================ */
.hint-02 {
  gap: 3px;
}
.hint-02 .ch {
  width: 11px;
  height: 11px;
  border-right: 1px solid rgba(255,255,255,0.7);
  border-bottom: 1px solid rgba(255,255,255,0.7);
  transform: rotate(45deg);
  animation: chfade 1.6s ease-in-out infinite;
}
.hint-02 .ch:nth-child(1) { animation-delay: 0s; }
.hint-02 .ch:nth-child(2) { animation-delay: 0.22s; }
.hint-02 .ch:nth-child(3) { animation-delay: 0.44s; }
@keyframes chfade {
  0%,100% { opacity: 0.1; }
  50%      { opacity: 1; }
}

/* ================================
   案03：SCROLL テキスト＋ライン
================================ */
.hint-03 {
  gap: 10px;
}
.hint-03 .txt {
  font-size: 8px;
  letter-spacing: 0.45em;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  animation: pulse 2.4s ease-in-out infinite;
}
.hint-03 .line {
  width: 1px;
  height: 44px;
  background: rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
}
.hint-03 .line::after {
  content: '';
  position: absolute;
  top: -40%;
  left: 0;
  width: 100%;
  height: 50%;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.7));
  animation: drop 2s ease-in-out infinite;
  animation-delay: 0.5s;
}
@keyframes pulse {
  0%,100% { opacity: 0.3; }
  50%      { opacity: 1; }
}

/* ================================
   案04：マウスアイコン
================================ */
.hint-04 .mouse {
  width: 20px;
  height: 30px;
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 10px;
  position: relative;
}
.hint-04 .wheel {
  width: 2px;
  height: 5px;
  background: #fff;
  border-radius: 1px;
  position: absolute;
  top: 5px;
  left: 50%;
  transform: translateX(-50%);
  animation: wheel 1.8s ease-in-out infinite;
}
@keyframes wheel {
  0%   { top: 5px; opacity: 1; }
  60%  { top: 14px; opacity: 0.1; }
  100% { top: 5px; opacity: 0; }
}

/* ================================
   案05：円の中を玉が落ちる
================================ */
.hint-05 {
  gap: 10px;
}
.hint-05 .ring {
  width: 36px;
  height: 36px;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 50%;
  position: relative;
  overflow: hidden;
}
.hint-05 .ball {
  width: 8px;
  height: 8px;
  background: #fff;
  border-radius: 50%;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  animation: fall 2s ease-in-out infinite;
  box-shadow: 0 0 8px rgba(255,255,255,0.6);
}
@keyframes fall {
  0%   { top: -10px; opacity: 0; }
  20%  { opacity: 1; }
  70%  { top: 50%; opacity: 1; }
  100% { top: 110%; opacity: 0; }
}
.hint-05 .line {
  width: 1px;
  height: 24px;
  background: rgba(255,255,255,0.1);
}

/* ================================
   案06：矢印が下へ流れる
================================ */
.hint-06 .arr-wrap {
  width: 18px;
  height: 48px;
  position: relative;
}
.hint-06 .arr {
  position: absolute;
  left: 50%;
  width: 16px;
  height: 16px;
  border-right: 1px solid rgba(255,255,255,0.7);
  border-bottom: 1px solid rgba(255,255,255,0.7);
  transform: translateX(-50%) rotate(45deg);
  animation: slide 1.8s ease-out infinite;
}
.hint-06 .arr:nth-child(1) { animation-delay: 0s; }
.hint-06 .arr:nth-child(2) { animation-delay: 0.6s; }
@keyframes slide {
  0%   { top: 0;    opacity: 0; }
  30%  { opacity: 0.8; }
  100% { top: 28px; opacity: 0; }
}

/* ================================
   案07：左右の線＋テキスト
================================ */
.hint-07 {
  flex-direction: row;
  align-items: center;
  gap: 10px;
}
.hint-07 .sline {
  height: 1px;
  background: rgba(255,255,255,0.3);
  animation: expand 2s ease-in-out infinite;
}
@keyframes expand {
  0%,100% { width: 0; opacity: 0; }
  50%      { width: 32px; opacity: 1; }
}
.hint-07 .txt {
  font-size: 8px;
  letter-spacing: 0.35em;
  color: rgba(255,255,255,0.45);
  text-transform: uppercase;
  white-space: nowrap;
  animation: pulse 2s ease-in-out infinite;
}

/* ================================
   案08：縦線がフワッと現れ消える
================================ */
.hint-08 .long-line {
  width: 1px;
  height: 80px;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.6) 50%, transparent);
  animation: grow 2.2s ease-in-out infinite;
}
@keyframes grow {
  0%        { transform: scaleY(0); transform-origin: top; opacity: 0; }
  40%,60%   { transform: scaleY(1); opacity: 1; }
  100%      { transform: scaleY(0); transform-origin: bottom; opacity: 0; }
}

/* ================================
   案09：グロー点滅
================================ */
.hint-09 {
  gap: 10px;
}
.hint-09 .dot {
  width: 6px;
  height: 6px;
  background: #fff;
  border-radius: 50%;
  animation: glow 2s ease-in-out infinite;
}
@keyframes glow {
  0%,100% { box-shadow: 0 0 3px 1px rgba(255,255,255,0.2); transform: scale(1); }
  50%     { box-shadow: 0 0 14px 5px rgba(255,255,255,0.5), 0 0 36px 14px rgba(255,255,255,0.12); transform: scale(1.4); }
}
.hint-09 .line {
  width: 1px;
  height: 44px;
  background: rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
}
.hint-09 .line::after {
  content: '';
  position: absolute;
  top: -40%;
  left: 0;
  width: 100%;
  height: 50%;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.5));
  animation: drop 2s ease-in-out infinite;
  animation-delay: 0.4s;
}

/* ================================
   案10：回転リング
================================ */
.hint-10 {
  gap: 10px;
}
.hint-10 .rring {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
  border-top-color: rgba(255,255,255,0.7);
  animation: spin 2s linear infinite;
  position: relative;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.hint-10 .rring::after {
  content: '';
  width: 4px;
  height: 4px;
  background: #fff;
  border-radius: 50%;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 6px rgba(255,255,255,0.5);
}
.hint-10 .line {
  width: 1px;
  height: 24px;
  background: rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
}
.hint-10 .line::after {
  content: '';
  position: absolute;
  top: -40%;
  left: 0;
  width: 100%;
  height: 50%;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.5));
  animation: drop 2s ease-in-out infinite;
}

/* ================================
   共通ヒント wrapper
================================ */
.hint {
  display: flex;
  flex-direction: column;
  align-items: center;
}

</style>
</head>
<body>

<h1>Scroll Indicator — 10 Variations</h1>

<div class="grid">

  <div class="cell">
    <span class="cell-num">01</span>
    <div class="hint hint-01"><div class="line"></div></div>
    <span class="cell-label">光が落ちる</span>
  </div>

  <div class="cell">
    <span class="cell-num">02</span>
    <div class="hint hint-02">
      <div class="ch"></div><div class="ch"></div><div class="ch"></div>
    </div>
    <span class="cell-label">シェブロン</span>
  </div>

  <div class="cell">
    <span class="cell-num">03</span>
    <div class="hint hint-03">
      <div class="txt">Scroll</div>
      <div class="line"></div>
    </div>
    <span class="cell-label">テキスト＋ライン</span>
  </div>

  <div class="cell">
    <span class="cell-num">04</span>
    <div class="hint hint-04">
      <div class="mouse"><div class="wheel"></div></div>
    </div>
    <span class="cell-label">マウスアイコン</span>
  </div>

  <div class="cell">
    <span class="cell-num">05</span>
    <div class="hint hint-05">
      <div class="ring"><div class="ball"></div></div>
      <div class="line"></div>
    </div>
    <span class="cell-label">円の中を玉が落ちる</span>
  </div>

  <div class="cell">
    <span class="cell-num">06</span>
    <div class="hint hint-06">
      <div class="arr-wrap"><div class="arr"></div><div class="arr"></div></div>
    </div>
    <span class="cell-label">矢印が流れる</span>
  </div>

  <div class="cell">
    <span class="cell-num">07</span>
    <div class="hint hint-07">
      <div class="sline"></div>
      <div class="txt">Scroll</div>
      <div class="sline"></div>
    </div>
    <span class="cell-label">左右の線が伸びる</span>
  </div>

  <div class="cell">
    <span class="cell-num">08</span>
    <div class="hint hint-08"><div class="long-line"></div></div>
    <span class="cell-label">縦線がフワッと現れる</span>
  </div>

  <div class="cell">
    <span class="cell-num">09</span>
    <div class="hint hint-09">
      <div class="dot"></div>
      <div class="line"></div>
    </div>
    <span class="cell-label">グロー点滅</span>
  </div>

  <div class="cell">
    <span class="cell-num">10</span>
    <div class="hint hint-10">
      <div class="rring"></div>
      <div class="line"></div>
    </div>
    <span class="cell-label">回転リング</span>
  </div>

</div>

</body>
</html>
