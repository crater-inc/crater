<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スクロール誘導 — 03番ベース バリエーション</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #0d0d0d;
  color: #fff;
  padding: 64px 40px 100px;
}

h1 {
  font-size: 10px;
  letter-spacing: 0.4em;
  color: rgba(255,255,255,0.2);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 56px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  max-width: 960px;
  margin: 0 auto;
}

.cell {
  aspect-ratio: 3 / 5;
  background: linear-gradient(160deg, #141414 0%, #181825 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 32px;
  position: relative;
  overflow: hidden;
}

.cell-num {
  position: absolute;
  top: 14px;
  left: 14px;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.18);
}

.cell-label {
  position: absolute;
  bottom: 12px;
  left: 0; right: 0;
  text-align: center;
  font-size: 8px;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.22);
  line-height: 1.7;
  padding: 0 6px;
}

.rail-wrap {
  position: relative;
  width: 1px;
  height: 70px;
  background: rgba(255,255,255,0.1);
}

.dot {
  width: 6px;
  height: 6px;
  background: #fff;
  border-radius: 50%;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 0;
}

/* ========================================
   全案共通：フェードイン→上から落ちる
   ベース動き：ease-out（加速→ゆっくり）
======================================== */

/* 01: ease-out 標準 */
.c1 .dot { animation: v1 2s ease-out infinite; }
@keyframes v1 {
  0%   { top: -8px; opacity: 0; }
  10%  { opacity: 1; }
  85%  { opacity: 1; }
  100% { top: 70px; opacity: 0; }
}

/* 02: cubic-bezier — 急加速してゆっくり止まる */
.c2 .dot { animation: v2 2s cubic-bezier(0.7, 0, 0.3, 1) infinite; }
@keyframes v2 {
  0%   { top: -8px; opacity: 0; }
  10%  { opacity: 1; }
  85%  { opacity: 1; }
  100% { top: 70px; opacity: 0; }
}

/* 03: 超なめらか・ゆっくりフェード（cubic-bezier 0.4 0 0.2 1）*/
.c3 .dot { animation: v3 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
@keyframes v3 {
  0%   { top: -8px; opacity: 0; }
  12%  { opacity: 1; }
  80%  { top: 70px; opacity: 1; }
  100% { top: 70px; opacity: 0; }
}

/* 04: 速い（短い時間でズバッと落ちる） */
.c4 .dot { animation: v4 1.2s ease-out infinite; animation-delay: 0s; }
@keyframes v4 {
  0%   { top: -8px; opacity: 0; }
  10%  { opacity: 1; }
  70%  { top: 70px; opacity: 1; }
  100% { top: 70px; opacity: 0; }
}

/* 05: 遅い（ゆっくりじわっと落ちる） */
.c5 .dot { animation: v5 3.2s ease-out infinite; }
@keyframes v5 {
  0%   { top: -8px; opacity: 0; }
  8%   { opacity: 1; }
  88%  { top: 70px; opacity: 1; }
  100% { top: 70px; opacity: 0; }
}

/* 06: 重力感（最後に少し跳ねずに吸い込まれる） */
.c6 .dot { animation: v6 2s cubic-bezier(0.55, 0, 1, 0.45) infinite; }
@keyframes v6 {
  0%   { top: -8px; opacity: 0; }
  10%  { opacity: 1; }
  78%  { top: 70px; opacity: 1; }
  100% { top: 70px; opacity: 0; }
}

</style>
</head>
<body>

<h1>Scroll Indicator — 03番ベース（ease-out）加速度バリエーション</h1>

<div class="grid">

  <div class="cell c1">
    <span class="cell-num">01</span>
    <div class="rail-wrap"><div class="dot"></div></div>
    <span class="cell-label">標準<br>ease-out</span>
  </div>

  <div class="cell c2">
    <span class="cell-num">02</span>
    <div class="rail-wrap"><div class="dot"></div></div>
    <span class="cell-label">急加速→<br>ゆっくり止まる</span>
  </div>

  <div class="cell c3">
    <span class="cell-num">03</span>
    <div class="rail-wrap"><div class="dot"></div></div>
    <span class="cell-label">超なめらか<br>material ease</span>
  </div>

  <div class="cell c4">
    <span class="cell-num">04</span>
    <div class="rail-wrap"><div class="dot"></div></div>
    <span class="cell-label">速い<br>ズバッと落ちる</span>
  </div>

  <div class="cell c5">
    <span class="cell-num">05</span>
    <div class="rail-wrap"><div class="dot"></div></div>
    <span class="cell-label">遅い<br>じわっと落ちる</span>
  </div>

  <div class="cell c6">
    <span class="cell-num">06</span>
    <div class="rail-wrap"><div class="dot"></div></div>
    <span class="cell-label">重力感<br>吸い込まれる</span>
  </div>

</div>

</body>
</html>
