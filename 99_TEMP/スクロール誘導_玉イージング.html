<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スクロール誘導 — 玉の動き比較</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #0d0d0d;
  color: #fff;
  padding: 64px 40px 100px;
}

h1 {
  font-size: 10px;
  letter-spacing: 0.4em;
  color: rgba(255,255,255,0.2);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 56px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  max-width: 960px;
  margin: 0 auto;
}

.cell {
  aspect-ratio: 3 / 5;
  background: linear-gradient(160deg, #141414 0%, #181825 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 32px;
  position: relative;
  overflow: hidden;
}

.cell-num {
  position: absolute;
  top: 14px;
  left: 14px;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.18);
}

.cell-label {
  position: absolute;
  bottom: 12px;
  left: 0; right: 0;
  text-align: center;
  font-size: 8px;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.22);
  line-height: 1.6;
  padding: 0 6px;
}

/* ===== ライン＋玉の構造 ===== */
.rail-wrap {
  position: relative;
  width: 1px;
  height: 70px;
  background: rgba(255,255,255,0.1);
}

.dot {
  width: 6px;
  height: 6px;
  background: #fff;
  border-radius: 50%;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 0;
}

/* ===== 01: linear ===== */
.c1 .dot {
  animation: move 1.8s linear infinite;
}

/* ===== 02: ease-in（ゆっくり→加速） ===== */
.c2 .dot {
  animation: move 1.8s ease-in infinite;
}

/* ===== 03: ease-out（加速→ゆっくり） ===== */
.c3 .dot {
  animation: move 1.8s ease-out infinite;
}

/* ===== 04: バウンス ===== */
.c4 .dot {
  animation: move-bounce 2.4s ease-out infinite;
}

/* ===== 05: ためてから落ちる ===== */
.c5 .dot {
  animation: move-pause 2.4s ease-in-out infinite;
}

/* ===== 06: 点滅しながら落ちる ===== */
.c6 .dot {
  animation: move-pulse 2.2s linear infinite;
}

/* ===== keyframes ===== */
@keyframes move {
  0%   { top: -8px;  opacity: 0; }
  10%  { opacity: 1; }
  85%  { opacity: 1; }
  100% { top: 70px;  opacity: 0; }
}

@keyframes move-bounce {
  0%   { top: -8px;  opacity: 0; }
  10%  { opacity: 1; }
  60%  { top: 70px; }
  72%  { top: 50px; }
  82%  { top: 68px; }
  90%  { top: 58px; }
  97%  { top: 66px; opacity: 1; }
  100% { top: 66px; opacity: 0; }
}

@keyframes move-pause {
  0%   { top: -8px;  opacity: 0; }
  8%   { opacity: 1; }
  20%  { top: 20px; }
  50%  { top: 20px; }
  90%  { top: 70px; opacity: 1; }
  100% { top: 70px; opacity: 0; }
}

@keyframes move-pulse {
  0%   { top: -8px;  opacity: 0; }
  8%   { opacity: 1; }
  22%  { top: 18px; opacity: 1; }
  30%  { top: 18px; opacity: 0.1; }
  40%  { top: 18px; opacity: 1; }
  58%  { top: 46px; opacity: 1; }
  65%  { top: 46px; opacity: 0.1; }
  75%  { top: 46px; opacity: 1; }
  90%  { top: 70px; opacity: 1; }
  100% { top: 70px; opacity: 0; }
}

</style>
</head>
<body>

<h1>Scroll Indicator — 玉の動き 6パターン</h1>

<div class="grid">

  <div class="cell c1">
    <span class="cell-num">01</span>
    <div class="rail-wrap"><div class="dot"></div></div>
    <span class="cell-label">一定速度<br>linear</span>
  </div>

  <div class="cell c2">
    <span class="cell-num">02</span>
    <div class="rail-wrap"><div class="dot"></div></div>
    <span class="cell-label">ゆっくり→加速<br>ease-in</span>
  </div>

  <div class="cell c3">
    <span class="cell-num">03</span>
    <div class="rail-wrap"><div class="dot"></div></div>
    <span class="cell-label">加速→ゆっくり<br>ease-out</span>
  </div>

  <div class="cell c4">
    <span class="cell-num">04</span>
    <div class="rail-wrap"><div class="dot"></div></div>
    <span class="cell-label">バウンス<br>跳ねる</span>
  </div>

  <div class="cell c5">
    <span class="cell-num">05</span>
    <div class="rail-wrap"><div class="dot"></div></div>
    <span class="cell-label">ためてから落ちる<br>pause → drop</span>
  </div>

  <div class="cell c6">
    <span class="cell-num">06</span>
    <div class="rail-wrap"><div class="dot"></div></div>
    <span class="cell-label">点滅しながら落ちる<br>pulse</span>
  </div>

</div>

</body>
</html>
