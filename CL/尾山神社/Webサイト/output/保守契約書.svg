<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif">

  <!-- 背景 -->
  <rect width="794" height="1123" fill="#fff"/>

  <!-- 上部ライン -->
  <rect x="56" y="56" width="682" height="3" fill="#222"/>

  <!-- タイトル -->
  <text x="397" y="108" text-anchor="middle" font-size="22" font-weight="bold" fill="#111" letter-spacing="6">Webサイト保守・運用サポート契約書</text>

  <!-- 下部細線 -->
  <line x1="56" y1="120" x2="738" y2="120" stroke="#bbb" stroke-width="0.8"/>

  <!-- 甲乙 -->
  <text x="56" y="152" font-size="11" fill="#444">本契約は、以下の当事者間において締結されます。</text>
  <text x="56" y="174" font-size="11" fill="#111"><tspan font-weight="bold">甲（委託者）</tspan>　尾山神社</text>
  <text x="56" y="194" font-size="11" fill="#111"><tspan font-weight="bold">乙（受託者）</tspan>　株式会社クレーター　代表取締役　明里 圭修</text>
  <text x="56" y="214" font-size="11" fill="#111">　　　　　　　　〒155-0031 東京都世田谷区北沢3丁目20-18 北沢宝ビル3F</text>

  <line x1="56" y1="228" x2="738" y2="228" stroke="#bbb" stroke-width="0.8"/>

  <!-- 第1条 -->
  <text x="56" y="252" font-size="12" font-weight="bold" fill="#111">第1条（委託業務の範囲）</text>
  <text x="56" y="272" font-size="10.5" fill="#333">甲は乙に対し、以下の業務を委託します。</text>

  <!-- サービス内容 -->
  <text x="72" y="292" font-size="10.5" fill="#333">①　サーバー・ドメイン・メールアカウントの保守運用および不具合発生時の対応</text>
  <text x="72" y="310" font-size="10.5" fill="#333">②　infoページの更新サポート（甲が操作方法を確認したい場合のサポートを含む）</text>
  <text x="72" y="328" font-size="10.5" fill="#333">③　infoページ更新後にレイアウト不具合が発生した場合の修正対応</text>
  <text x="72" y="346" font-size="10.5" fill="#333">④　ページ内の簡単な文字修正（それに伴う大きなレイアウト調整は第3条に準ずる）</text>

  <line x1="56" y1="362" x2="738" y2="362" stroke="#eee" stroke-width="0.8"/>

  <!-- 第2条 委託料 -->
  <text x="56" y="384" font-size="12" font-weight="bold" fill="#111">第2条（委託料および支払い方法）</text>
  <text x="72" y="404" font-size="10.5" fill="#333">月額　金 8,000円（税抜）／税込 8,800円</text>
  <text x="72" y="422" font-size="10.5" fill="#333">支払いは毎月払いまたは年間一括払い（96,000円税抜）のいずれかを選択できます。</text>
  <text x="72" y="440" font-size="10.5" fill="#333">毎月払いの場合、当月末日までに翌月分を下記口座へお振込みください。</text>
  <text x="72" y="458" font-size="10.5" fill="#333">振込手数料は甲のご負担とします。</text>

  <!-- 振込先ボックス -->
  <rect x="72" y="468" width="560" height="58" rx="4" fill="#f7f7f7" stroke="#ddd" stroke-width="0.8"/>
  <text x="88" y="486" font-size="10" fill="#888">【振込先】</text>
  <text x="88" y="502" font-size="10.5" fill="#222">PayPay銀行　ビジネス営業部　普通預金　口座番号：2494606</text>
  <text x="88" y="518" font-size="10.5" fill="#222">口座名義：カ）クレーター</text>

  <line x1="56" y1="538" x2="738" y2="538" stroke="#eee" stroke-width="0.8"/>

  <!-- 第3条 対象外 -->
  <text x="56" y="560" font-size="12" font-weight="bold" fill="#111">第3条（委託業務の対象外）</text>
  <text x="56" y="578" font-size="10.5" fill="#333">以下の業務は本契約の対象外とし、発生した場合は別途お見積りのうえ対応いたします。</text>
  <text x="72" y="596" font-size="10.5" fill="#333">①　infoページ以外のページを操作したことによる不具合の修復作業</text>
  <text x="72" y="614" font-size="10.5" fill="#333">②　新規ページの作成、既存ページの大幅な構成変更・デザイン変更</text>
  <text x="72" y="632" font-size="10.5" fill="#333">③　その他、相当の工数を要する修正・追加対応</text>

  <line x1="56" y1="648" x2="738" y2="648" stroke="#eee" stroke-width="0.8"/>

  <!-- 第4条 契約期間 -->
  <text x="56" y="670" font-size="12" font-weight="bold" fill="#111">第4条（契約期間および解約）</text>
  <text x="72" y="690" font-size="10.5" fill="#333">本契約は締結日より効力を生じ、いずれかの当事者から書面または電子メールによる</text>
  <text x="72" y="707" font-size="10.5" fill="#333">解約通知がない限り、自動的に継続します。</text>
  <text x="72" y="724" font-size="10.5" fill="#333">解約を希望する場合は、終了希望月の1ヶ月前までに相手方へ通知するものとします。</text>
  <text x="72" y="741" font-size="10.5" fill="#333">年間一括払いの場合、既払い分の返金は原則行いません。</text>

  <line x1="56" y1="757" x2="738" y2="757" stroke="#eee" stroke-width="0.8"/>

  <!-- 第5条 対応時間 -->
  <text x="56" y="779" font-size="12" font-weight="bold" fill="#111">第5条（対応時間）</text>
  <text x="72" y="799" font-size="10.5" fill="#333">問い合わせを受領後、原則3営業日以内にご返答いたします。</text>

  <line x1="56" y1="815" x2="738" y2="815" stroke="#eee" stroke-width="0.8"/>

  <!-- 第6条 免責 -->
  <text x="56" y="837" font-size="12" font-weight="bold" fill="#111">第6条（免責事項）</text>
  <text x="72" y="857" font-size="10.5" fill="#333">サーバー会社・ドメイン管理会社・その他第三者サービスに起因する障害・停止については、</text>
  <text x="72" y="874" font-size="10.5" fill="#333">乙の責任範囲外とします。ただし乙は各サービス提供会社と速やかに連携し、</text>
  <text x="72" y="891" font-size="10.5" fill="#333">迅速な復旧に向けて誠実に対応いたします。</text>

  <line x1="56" y1="907" x2="738" y2="907" stroke="#eee" stroke-width="0.8"/>

  <!-- 第7条 メール -->
  <text x="56" y="929" font-size="12" font-weight="bold" fill="#111">第7条（メール容量について）</text>
  <text x="72" y="949" font-size="10.5" fill="#333">各メールアドレスの容量上限は10,000MBです（最大20,000MBまで増量可能）。</text>
  <text x="72" y="966" font-size="10.5" fill="#333">上限に達した場合は手動での削除が必要ですが、通常のメールのやりとりであれば</text>
  <text x="72" y="983" font-size="10.5" fill="#333">10年以上経過しても上限に達しにくい容量です。</text>

  <line x1="56" y1="999" x2="738" y2="999" stroke="#eee" stroke-width="0.8"/>

  <!-- 第8条 秘密保持 -->
  <text x="56" y="1021" font-size="12" font-weight="bold" fill="#111">第8条（秘密保持）</text>
  <text x="72" y="1041" font-size="10.5" fill="#333">甲乙双方は、本契約の履行上知り得た相手方の情報を、相手方の書面による同意なく</text>
  <text x="72" y="1058" font-size="10.5" fill="#333">第三者に開示・漏洩しないものとします。</text>

  <!-- 締結欄 -->
  <text x="397" y="1085" text-anchor="middle" font-size="10" fill="#888">本契約の締結を証するため、本書を2通作成し、甲乙各1通を保管します。</text>

  <!-- 下部ライン -->
  <rect x="56" y="1100" width="682" height="2" fill="#222"/>

  <!-- 日付・署名エリア -->
  <text x="56" y="1116" font-size="10" fill="#888">締結日：　　　　年　　月　　日</text>
  <text x="500" y="1116" font-size="10" fill="#888">甲　署名・捺印：</text>

</svg>
