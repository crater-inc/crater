<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif">

  <rect width="210" height="297" fill="#fff"/>

  <rect x="15" y="15" width="180" height="1.2" fill="#222"/>
  <text x="105" y="24" text-anchor="middle" font-size="4.5" font-weight="bold" fill="#111" letter-spacing="1">Webサイト保守・運用サポート契約書</text>
  <line x1="15" y1="29" x2="195" y2="29" stroke="#ccc" stroke-width="0.3"/>

  <!-- 第4条 -->
  <text x="15" y="40" font-size="3.8" font-weight="bold" fill="#111">第4条（契約期間および解約）</text>
  <text x="20" y="49" font-size="3.2" fill="#333">本契約は締結日より効力を生じ、いずれかの当事者から書面または電子メールによる解約通知が</text>
  <text x="20" y="57" font-size="3.2" fill="#333">ない限り、自動的に継続します。</text>
  <text x="20" y="65" font-size="3.2" fill="#333">解約を希望する場合は、終了希望月の1ヶ月前までに相手方へ通知するものとします。</text>
  <text x="20" y="73" font-size="3.2" fill="#333">年間一括払いの場合、既払い分の返金は原則行いません。</text>

  <line x1="15" y1="80" x2="195" y2="80" stroke="#eee" stroke-width="0.3"/>

  <!-- 第5条 -->
  <text x="15" y="90" font-size="3.8" font-weight="bold" fill="#111">第5条（対応時間）</text>
  <text x="20" y="99" font-size="3.2" fill="#333">問い合わせを受領後、原則3営業日以内にご返答いたします。</text>

  <line x1="15" y1="107" x2="195" y2="107" stroke="#eee" stroke-width="0.3"/>

  <!-- 第6条 -->
  <text x="15" y="117" font-size="3.8" font-weight="bold" fill="#111">第6条（免責事項）</text>
  <text x="20" y="126" font-size="3.2" fill="#333">サーバー会社・ドメイン管理会社・その他第三者サービスに起因する障害・停止については、</text>
  <text x="20" y="134" font-size="3.2" fill="#333">乙の責任範囲外とします。ただし乙は各サービス提供会社と速やかに連携し、</text>
  <text x="20" y="142" font-size="3.2" fill="#333">迅速な復旧に向けて誠実に対応いたします。</text>

  <line x1="15" y1="150" x2="195" y2="150" stroke="#eee" stroke-width="0.3"/>

  <!-- 第7条 -->
  <text x="15" y="160" font-size="3.8" font-weight="bold" fill="#111">第7条（メール容量について）</text>
  <text x="20" y="169" font-size="3.2" fill="#333">各メールアドレスの容量上限は10,000MB（最大20,000MBまで増量可能）です。</text>
  <text x="20" y="177" font-size="3.2" fill="#333">上限に達した場合は手動での削除が必要となりますが、通常のメールのやりとりであれば</text>
  <text x="20" y="185" font-size="3.2" fill="#333">10年以上経過しても上限に達しにくい容量です。</text>

  <line x1="15" y1="193" x2="195" y2="193" stroke="#eee" stroke-width="0.3"/>

  <!-- 第8条 -->
  <text x="15" y="203" font-size="3.8" font-weight="bold" fill="#111">第8条（秘密保持）</text>
  <text x="20" y="212" font-size="3.2" fill="#333">甲乙双方は、本契約の履行上知り得た相手方の情報を、相手方の書面による同意なく</text>
  <text x="20" y="220" font-size="3.2" fill="#333">第三者に開示・漏洩しないものとします。</text>

  <line x1="15" y1="228" x2="195" y2="228" stroke="#ccc" stroke-width="0.3"/>

  <!-- 締結文 -->
  <text x="105" y="238" text-anchor="middle" font-size="3" fill="#777">本契約の締結を証するため、本書を2通作成し、甲乙各1通を保管します。</text>

  <!-- 締結日 -->
  <text x="15" y="251" font-size="3.2" fill="#333">締結日：　　　　　年　　　月　　　日</text>

  <!-- 署名欄 -->
  <text x="15" y="264" font-size="3.2" fill="#555">甲（委託者）</text>
  <line x1="15" y1="273" x2="90" y2="273" stroke="#999" stroke-width="0.4"/>
  <text x="52" y="271" text-anchor="middle" font-size="2.6" fill="#aaa">署名・捺印</text>

  <text x="120" y="264" font-size="3.2" fill="#555">乙（受託者）</text>
  <line x1="120" y1="273" x2="195" y2="273" stroke="#999" stroke-width="0.4"/>
  <text x="157" y="271" text-anchor="middle" font-size="2.6" fill="#aaa">署名・捺印</text>

  <!-- ページ番号 -->
  <rect x="15" y="282" width="180" height="0.5" fill="#ddd"/>
  <text x="105" y="288" text-anchor="middle" font-size="2.8" fill="#aaa">2 / 3</text>

</svg>
