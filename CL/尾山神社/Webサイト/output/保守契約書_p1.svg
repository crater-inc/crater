<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif">

  <rect width="210" height="297" fill="#fff"/>

  <!-- 上部ライン -->
  <rect x="15" y="15" width="180" height="1.2" fill="#222"/>

  <!-- タイトル -->
  <text x="105" y="26" text-anchor="middle" font-size="6" font-weight="bold" fill="#111" letter-spacing="1.5">Webサイト保守・運用サポート契約書</text>

  <!-- 下細線 -->
  <line x1="15" y1="31" x2="195" y2="31" stroke="#ccc" stroke-width="0.3"/>

  <!-- 甲乙 -->
  <text x="15" y="40" font-size="3.2" fill="#444">本契約は、以下の当事者間において締結されます。</text>
  <text x="15" y="48" font-size="3.4" fill="#111"><tspan font-weight="bold">甲（委託者）</tspan>　尾山神社</text>
  <text x="15" y="55" font-size="3.4" fill="#111"><tspan font-weight="bold">乙（受託者）</tspan>　株式会社クレーター　代表取締役　明里 圭修</text>
  <text x="15" y="61" font-size="3.2" fill="#555">　　　　　　　　〒155-0031 東京都世田谷区北沢3丁目20-18 北沢宝ビル3F</text>

  <line x1="15" y1="67" x2="195" y2="67" stroke="#ccc" stroke-width="0.3"/>

  <!-- 第1条 -->
  <text x="15" y="76" font-size="3.8" font-weight="bold" fill="#111">第1条（委託業務の範囲）</text>
  <text x="15" y="84" font-size="3.2" fill="#333">甲は乙に対し、以下の業務を委託します。</text>
  <text x="20" y="92" font-size="3.2" fill="#333">①　サーバー・ドメイン・メールアカウントの保守運用および不具合発生時の対応</text>
  <text x="20" y="100" font-size="3.2" fill="#333">②　infoページの更新サポート（甲が操作方法を確認したい場合のサポートを含む）</text>
  <text x="20" y="108" font-size="3.2" fill="#333">③　infoページ更新後にレイアウト不具合が発生した場合の修正対応</text>
  <text x="20" y="116" font-size="3.2" fill="#333">④　ページ内の簡単な文字修正（大きなレイアウト調整が伴う場合は第3条に準ずる）</text>

  <line x1="15" y1="123" x2="195" y2="123" stroke="#eee" stroke-width="0.3"/>

  <!-- 第2条 -->
  <text x="15" y="132" font-size="3.8" font-weight="bold" fill="#111">第2条（委託料および支払い方法）</text>
  <text x="20" y="141" font-size="3.2" fill="#333">月額　金 8,000円（税抜）／税込 8,800円　※メールアカウント12件まで含む</text>
  <text x="20" y="149" font-size="3.2" fill="#333">13件目以降は1件追加ごとに月額 500円（税抜）が加算されます。</text>
  <text x="20" y="157" font-size="3.2" fill="#333">支払いは毎月払いまたは年間一括払い（96,000円税抜）のいずれかを選択できます。</text>
  <text x="20" y="165" font-size="3.2" fill="#333">毎月払いの場合、当月末日までに翌月分を下記口座へお振込みください。</text>
  <text x="20" y="173" font-size="3.2" fill="#333">振込手数料は甲のご負担とします。</text>

  <!-- 振込先ボックス -->
  <rect x="20" y="178" width="155" height="20" rx="2" fill="#f7f7f7" stroke="#ddd" stroke-width="0.4"/>
  <text x="27" y="186" font-size="2.8" fill="#888">【振込先】</text>
  <text x="27" y="192" font-size="3.2" fill="#222">PayPay銀行　ビジネス営業部　普通預金　口座番号：2494606</text>
  <text x="27" y="197" font-size="3.2" fill="#222">口座名義：カ）クレーター</text>

  <line x1="15" y1="204" x2="195" y2="204" stroke="#eee" stroke-width="0.3"/>

  <!-- 第3条 -->
  <text x="15" y="213" font-size="3.8" font-weight="bold" fill="#111">第3条（委託業務の対象外）</text>
  <text x="15" y="222" font-size="3.2" fill="#333">以下の業務は本契約の対象外とし、発生した場合は別途お見積りのうえ対応いたします。</text>
  <text x="20" y="230" font-size="3.2" fill="#333">①　infoページ以外のページを操作したことによる不具合の修復作業</text>
  <text x="20" y="238" font-size="3.2" fill="#333">②　新規ページの作成、既存ページの大幅な構成変更・デザイン変更</text>
  <text x="20" y="246" font-size="3.2" fill="#333">③　その他、相当の工数を要する修正・追加対応</text>

  <!-- ページ番号 -->
  <text x="105" y="288" text-anchor="middle" font-size="2.8" fill="#aaa">1 / 3</text>
  <rect x="15" y="282" width="180" height="0.5" fill="#ddd"/>

</svg>
