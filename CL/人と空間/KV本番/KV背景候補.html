<!DOCTYPE html>

<title>人と空間 KV背景候補</title>
<style>
  :root{ --text:#111; --sub:#555; --meta:#888; --line:#E8E8E8; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#FFFFFF; color:var(--text); font-family:'Helvetica Neue','Hiragino Sans','Noto Sans JP',sans-serif; font-size:16px; line-height:1.7; overflow-x:hidden; }
  .wrap{ width:100%; max-width:1600px; margin:0 auto; padding:48px 40px 80px; }
  header{ display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:36px; gap:16px; flex-wrap:wrap; }
  h1{ font-size:22px; font-weight:700; margin:0; letter-spacing:0.02em; }
  .lead{ color:var(--sub); font-size:14px; margin:6px 0 0; }
  .date{ color:var(--meta); font-size:12px; letter-spacing:0.08em; }
  .group{ margin-bottom:56px; }
  .group h2{ font-size:14px; font-weight:700; letter-spacing:0.12em; color:var(--sub); margin:0 0 16px; }
  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:32px 28px; }
  .card a{ display:block; text-decoration:none; color:inherit; }
  .card img{ width:100%; height:auto; display:block; border:1px solid var(--line); background:#F5F5F5; }
  .cap{ display:flex; align-items:baseline; gap:12px; margin-top:10px; }
  .no{ font-size:20px; font-weight:700; letter-spacing:0.02em; }
  .ttl{ font-size:15px; font-weight:700; }
  .meta{ color:var(--meta); font-size:12px; margin-left:auto; letter-spacing:0.04em; white-space:normal; }
  .note{ color:var(--sub); font-size:14px; margin:4px 0 0; }
  @media (max-width:768px){
    .wrap{ padding:32px 32px 64px; }
    .grid{ grid-template-columns:1fr; gap:28px; }
    .meta{ margin-left:0; width:100%; }
  }
</style>
</head>
