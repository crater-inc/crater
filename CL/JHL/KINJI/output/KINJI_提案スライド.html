<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新ブランドライン 立ち上げ提案</title>
  <link rel="stylesheet" href="https://use.typekit.net/qwe2tdt.css">
  <link rel="stylesheet" href="https://morisawafonts.net/c/01KSMBH35VT2E86JG92RAXZ7XC/mf.css">
  <script>
    (function(d) {
      var config = { kitId: 'qwe2tdt', scriptTimeout: 3000, async: true },
      h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s);
    })(document);
  </script>
  <style>
    :root {
      --c-base:   #DBDDDD;
      --c-black:  #000000;
      --c-text:   #000000;
      --c-sub:    #000000;
      --c-light:  #B0B0B0;
      --c-border: rgba(0,0,0,0.15);
      --font-en:  'urw-din', sans-serif;
      --font-ja:  'MFW-PA1GothicStdN-Regular', sans-serif;
      --font-ja-m: 'MFW-PA1GothicStdN-Medium', sans-serif;
      --font-ja-b: 'MFW-PA1GothicStdN-Bold', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #EBEBEB; overflow: hidden; }
    :lang(ja) { line-break: strict; }
    h1,h2,h3 { word-break: normal; overflow-wrap: normal; text-wrap: balance; }
    p, li { word-break: normal; overflow-wrap: normal; text-wrap: pretty; }

    .slide-stage {
      width: 100vw; height: 100vh;
      background: #EBEBEB;
      overflow: hidden; position: relative;
    }
    .slide {
      width: 1920px; height: 1080px;
      position: absolute; top: 50%; left: 50%;
      overflow: hidden;
      background: var(--c-base);
      container-type: inline-size;
      display: none;
      transform-origin: center center;
    }
    .slide.active { display: flex; flex-direction: column; }

    .badge {
      display: inline-flex; align-items: center;
      background: var(--c-black); color: #fff;
      font-family: var(--font-en);
      font-size: 0.85cqw; font-weight: 500;
      letter-spacing: 0.14em;
      padding: 0.55cqw 0.85cqw;
      border-radius: 0; line-height: 1;
    }
    .slide-copy {
      position: absolute; right: 2.4cqw; bottom: 2.4cqw;
      font-family: var(--font-en); font-size: 0.72cqw;
      letter-spacing: 0.08em; color: var(--c-sub);
    }

    /* ナビ */
    .nav-prev, .nav-next {
      position: fixed; top: 0; width: 50%; height: 100%;
      z-index: 100; cursor: pointer;
    }
    .nav-prev { left: 0; } .nav-next { right: 0; }
    .menu-btn {
      position: fixed; width: 36px; height: 36px; z-index: 300;
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
    }
    .menu-btn span { display: block; width: 18px; height: 1px; background: #111; }
    .progress-bar {
      position: fixed; bottom: 0; left: 0;
      height: 2px; background: #111;
      transition: width 0.3s ease; z-index: 200;
    }
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 400; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
    .sidebar {
      position: absolute; top: 0; right: -300px; bottom: 0;
      width: 280px; background: #2a2a2a; color: #fff;
      transition: right 0.3s ease; display: flex; flex-direction: column;
    }
    .sidebar-overlay.open .sidebar { right: 0; }
    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-logo { display: block; height: 14px; width: auto; filter: invert(1); opacity: 0.85; }
    .sidebar-close { background: none; border: none; color: rgba(255,255,255,0.3); font-size: 13px; cursor: pointer; }
    .sidebar-list { padding: 8px 0; flex: 1; overflow-y: auto; }
    .sidebar-item {
      display: flex; align-items: center; gap: 14px;
      width: 100%; padding: 11px 24px;
      background: none; border: none; cursor: pointer;
      font-family: var(--font-ja-m); font-size: 11px;
      letter-spacing: 0.06em; color: rgba(255,255,255,0.35);
      text-align: left; transition: color 0.15s;
    }
    .sidebar-item:hover { color: rgba(255,255,255,0.7); }
    .sidebar-item.active { color: #fff; }
    .sidebar-num { font-family: var(--font-en); font-size: 10px; opacity: 0.25; min-width: 20px; }

    .em-line {
      position: relative; display: inline;
      background: linear-gradient(#FFE500, #FFE500) 0 0.8em / 100% 0.18em no-repeat;
    }
    .em-black {
      display: inline; background: var(--c-black); color: #ffffff;
      padding: 0.12em 0.15em; line-height: inherit; font-family: inherit;
    }

    /* TYPE: 表紙 */
    .s-cover {
      height: 100%; padding: 6cqw 7cqw;
      display: flex; flex-direction: column;
      justify-content: space-between; position: relative;
    }
    .s-cover-top { flex-shrink: 0; }
    .s-cover-main {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 0.4cqw;
    }
    .s-cover-eyebrow {
      font-family: var(--font-ja); font-size: 1.3cqw;
      color: var(--c-light); letter-spacing: 0.12em;
    }
    .s-cover-title {
      font-family: var(--font-ja-m); font-size: 4.4cqw;
      line-height: 1.2; letter-spacing: 0.04em;
    }
    .s-cover-sub {
      font-family: var(--font-ja); font-size: 1.4cqw;
      color: var(--c-sub); letter-spacing: 0.06em;
      margin-top: 0.8cqw;
      max-width: 50cqw;
      line-height: 1.8;
    }
    .s-cover-footer {
      flex-shrink: 0; display: flex; flex-direction: column;
      align-items: flex-start; gap: 1.0cqw;
    }

    /* TYPE: 目次 */
    .s-agenda {
      height: 100%; padding: 4cqw 7cqw 5cqw 7cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-agenda-top { flex-shrink: 0; }
    .s-agenda-list { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .s-agenda-item {
      display: grid; grid-template-columns: 4cqw 1fr;
      align-items: center;
      padding: 1.5cqw 0;
      border-bottom: 1px solid var(--c-border);
    }
    .s-agenda-item:first-child { border-top: 1px solid var(--c-border); }
    .s-agenda-num {
      font-family: var(--font-en); font-size: 2.0cqw;
      font-weight: 500; color: var(--c-light); letter-spacing: 0.05em;
    }
    .s-agenda-name {
      font-family: var(--font-ja-m); font-size: 2.0cqw;
      color: var(--c-text); letter-spacing: 0.04em;
      padding-left: 1.5cqw;
    }
    .s-agenda-copy {
      position: absolute; right: 5cqw; bottom: 3.5cqw;
      font-family: var(--font-en); font-size: 0.72cqw;
      letter-spacing: 0.08em; color: var(--c-light);
    }

    /* TYPE: セクション区切り */
    .s-section {
      height: 100%; padding: 4cqw 7cqw 5cqw 7cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-section-main {
      flex: 1; display: flex; align-items: center;
    }
    .s-section-num-main {
      font-family: var(--font-en); font-size: 7.2cqw;
      font-weight: 400; line-height: 1; letter-spacing: -0.04em;
      color: var(--c-text); transform: translateY(-0.25cqw);
    }
    .s-section-divider {
      width: 1px; height: 5.5cqw;
      background: var(--c-border); flex-shrink: 0; margin: 0 2cqw;
    }
    .s-section-text-col {
      flex: 1; display: flex; flex-direction: column; gap: 0.6cqw; justify-content: center;
    }
    .s-section-label {
      font-family: var(--font-ja-m); font-size: 1.15cqw;
      letter-spacing: 0.1em; color: var(--c-light); line-height: 1;
      padding-left: 4px;
    }
    .s-section-name {
      font-family: var(--font-en); font-size: 3.8cqw;
      font-weight: 500; line-height: 1; letter-spacing: 0.02em;
    }

    /* TYPE: ステートメント */
    .s-stmt {
      height: 100%; padding: 4cqw 7cqw 5cqw 7cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-stmt-top { position: absolute; top: calc(2.4cqw - 1px); left: 2.4cqw; }
    .s-stmt-main {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 1.6cqw;
    }
    .s-stmt-heading {
      font-family: var(--font-ja-m); font-size: 4.8cqw;
      line-height: 1.2; letter-spacing: 0.04em; margin-left: -2px;
    }
    .s-stmt-body {
      font-family: var(--font-ja); font-size: 1.4cqw;
      line-height: 1.95; color: var(--c-sub);
      max-width: 52cqw;
    }

    /* TYPE: リスト（左見出し＋右一覧） */
    .s-list {
      height: 100%; padding: 4cqw 7cqw 5cqw 7cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-list-top { position: absolute; top: calc(2.4cqw - 1px); left: 2.4cqw; }
    .s-list-main {
      flex: 1; display: flex; align-items: center; gap: 6cqw;
    }
    .s-list-left { flex: 0 0 26cqw; }
    .s-list-heading {
      font-family: var(--font-ja-m); font-size: 3.2cqw;
      line-height: 1.45; letter-spacing: 0.04em;
    }
    .s-list-right { flex: 1; }
    .s-list-items { list-style: none; }
    .s-list-item {
      display: grid; grid-template-columns: 3.2cqw 1fr;
      align-items: baseline; gap: 1.2cqw;
      padding: 1.3cqw 0;
      border-bottom: 1px solid var(--c-border);
    }
    .s-list-item:first-child { border-top: 1px solid var(--c-border); }
    .s-list-num {
      font-family: var(--font-en); font-size: 1.1cqw;
      color: var(--c-light); letter-spacing: 0.06em;
    }
    .s-list-body { display: flex; flex-direction: column; gap: 0.3cqw; }
    .s-list-name {
      font-family: var(--font-ja-m); font-size: 1.3cqw;
      letter-spacing: 0.03em;
    }
    .s-list-desc {
      font-family: var(--font-ja); font-size: 1.05cqw;
      color: var(--c-light); line-height: 1.7;
    }

    /* TYPE: コピードン（中央） */
    .s-copy-slide {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 5cqw; position: relative;
    }

    /* TYPE: コピー提案（複数案並列） */
    .s-proposals {
      height: 100%; padding: 4cqw 7cqw 5cqw 7cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-proposals-top { position: absolute; top: calc(2.4cqw - 1px); left: 2.4cqw; }
    .s-proposals-main {
      flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.4cqw;
    }
    .s-proposals-lead {
      font-family: var(--font-ja-m); font-size: 1.3cqw;
      letter-spacing: 0.06em; color: var(--c-light);
      margin-bottom: 0.4cqw;
    }
    .s-proposal-item {
      display: grid; grid-template-columns: 3.5cqw 1fr;
      align-items: start; gap: 1.6cqw;
      padding: 1.4cqw 0;
      border-bottom: 1px solid var(--c-border);
    }
    .s-proposal-item:first-of-type { border-top: 1px solid var(--c-border); }
    .s-proposal-label {
      font-family: var(--font-en); font-size: 0.85cqw;
      letter-spacing: 0.16em; color: var(--c-light);
      padding-top: 0.3cqw;
    }
    .s-proposal-body { display: flex; flex-direction: column; gap: 0.3cqw; }
    .s-proposal-copy {
      font-family: var(--font-ja-m); font-size: 2.6cqw;
      letter-spacing: 0.04em; line-height: 1.15;
    }
    .s-proposal-note {
      font-family: var(--font-ja); font-size: 1.05cqw;
      color: var(--c-light); line-height: 1.7; margin-top: 0.2cqw;
    }

    /* TYPE: フレーバー展開（上下2段） */
    .s-flavor {
      height: 100%; padding: 4cqw 7cqw 5cqw 7cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-flavor-top { position: absolute; top: calc(2.4cqw - 1px); left: 2.4cqw; }
    .s-flavor-main {
      flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2.4cqw;
    }
    .s-flavor-headline {
      font-family: var(--font-ja-m); font-size: 3.0cqw;
      letter-spacing: 0.04em; line-height: 1.3;
    }
    .s-flavor-sub {
      font-family: var(--font-ja); font-size: 1.3cqw;
      color: var(--c-light); line-height: 1.8;
      margin-top: -1.2cqw;
    }
    .s-flavor-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 0; border-top: 1px solid var(--c-border);
    }
    .s-flavor-item {
      padding: 1.6cqw 2cqw 1.6cqw 0;
      border-right: 1px solid var(--c-border);
      display: flex; flex-direction: column; gap: 0.5cqw;
    }
    .s-flavor-item:last-child { border-right: none; padding-right: 0; }
    .s-flavor-item:first-child { padding-left: 0; }
    .s-flavor-name {
      font-family: var(--font-ja-m); font-size: 2.0cqw;
      letter-spacing: 0.04em;
    }
    .s-flavor-en {
      font-family: var(--font-en); font-size: 0.9cqw;
      letter-spacing: 0.18em; color: var(--c-light); line-height: 1;
    }
    .s-flavor-desc {
      font-family: var(--font-ja); font-size: 1.0cqw;
      color: var(--c-light); line-height: 1.75;
      margin-top: 0.3cqw;
    }
    .s-flavor-use {
      font-family: var(--font-ja); font-size: 0.95cqw;
      color: var(--c-light); line-height: 1.7;
      margin-top: 0.4cqw;
      padding-top: 0.6cqw;
      border-top: 1px solid var(--c-border);
    }

    /* TYPE: Closing */
    .s-closing {
      height: 100%; padding: 6cqw 7cqw;
      display: flex; flex-direction: column;
      justify-content: space-between; position: relative;
    }
    .s-closing-main {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 1.2cqw;
    }
    .s-closing-en {
      font-family: var(--font-en); font-size: 5.2cqw;
      font-weight: 500; line-height: 1; letter-spacing: 0.02em;
    }
    .s-closing-ja {
      font-family: var(--font-ja-m); font-size: 1.8cqw;
      letter-spacing: 0.1em; margin-top: 0.4cqw;
    }
    .s-closing-body {
      font-family: var(--font-ja); font-size: 1.2cqw;
      color: var(--c-light); line-height: 1.85;
      max-width: 44cqw; margin-top: 1.2cqw;
    }
    .s-closing-footer {
      flex-shrink: 0; display: flex; align-items: center; gap: 1.6cqw;
    }

    /* 2分割レイアウト用 */
    .s-half-left {
      position: absolute; top: 0; left: 0;
      width: 58%; height: 1080px;
      padding: 4cqw 4cqw 4cqw 7cqw;
      display: flex; flex-direction: column; justify-content: center;
    }
    .s-half-right {
      position: absolute; top: 0; right: 0;
      width: 42%; height: 1080px;
      display: flex; flex-direction: column; justify-content: center;
      padding: 4cqw 7cqw 4cqw 4cqw;
      border-left: 1px solid var(--c-border);
    }
    .s-abs-badge {
      position: absolute; top: calc(2.4cqw - 1px); left: 2.4cqw; z-index: 2;
    }
  </style>
</head>
<body>

<div class="slide-stage" id="slide-stage"></div>
<div class="nav-prev" id="nav-prev"></div>
<div class="nav-next" id="nav-next"></div>
<button class="menu-btn" id="menu-btn"><span></span><span></span><span></span></button>
<div class="progress-bar" id="progress-bar" style="width:0"></div>

<div class="sidebar-overlay" id="sidebar-overlay">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img class="sidebar-logo" src="assets/logo.svg" alt="CRATER">
      <button class="sidebar-close" id="sidebar-close">✕</button>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
  </nav>
</div>

<script>

// P1: 表紙
function slide01Cover() {
  return `<section class="slide" data-section="cover">
  <div class="s-cover">
    <div class="s-cover-top">
      <span class="badge">2026.06　JHL+</span>
    </div>
    <div class="s-cover-main">
      <p class="s-cover-eyebrow">新ブランド立ち上げ提案</p>
      <h1 class="s-cover-title">この先の人生を、<br>もっと輝かせる。</h1>
      <p class="s-cover-sub">
        加賀の金時草という唯一の素材を軸に、<br>
        20〜40代が手に取れる新しいブランドを設計します。
      </p>
    </div>
    <div class="s-cover-footer">
      <img src="assets/logo.svg" alt="CRATER" style="height:1.4cqw;width:auto;">
      <span style="font-family:var(--font-en);font-size:0.72cqw;letter-spacing:0.08em;color:var(--c-light);">©CRATER Inc.</span>
    </div>
  </div>
</section>`;
}

// P2: 目次
function slide02Agenda() {
  return `<section class="slide" data-section="agenda">
  <div class="s-agenda">
    <div class="s-agenda-top"><span class="badge">CONTENTS</span></div>
    <div class="s-agenda-list">
      <div class="s-agenda-item">
        <span class="s-agenda-num">01</span>
        <span class="s-agenda-name">ブランドコンセプト</span>
      </div>
      <div class="s-agenda-item">
        <span class="s-agenda-num">02</span>
        <span class="s-agenda-name">ターゲットと立ち位置</span>
      </div>
      <div class="s-agenda-item">
        <span class="s-agenda-num">03</span>
        <span class="s-agenda-name">外向けコピー 提案</span>
      </div>
      <div class="s-agenda-item">
        <span class="s-agenda-num">04</span>
        <span class="s-agenda-name">ブランド名 KINJI</span>
      </div>
      <div class="s-agenda-item">
        <span class="s-agenda-num">05</span>
        <span class="s-agenda-name">粉で混ぜる フレーバー展開</span>
      </div>
      <div class="s-agenda-item">
        <span class="s-agenda-num">06</span>
        <span class="s-agenda-name">商品ライン・展開イメージ</span>
      </div>
    </div>
    <span class="s-agenda-copy">©CRATER Inc.</span>
  </div>
</section>`;
}

// P3: 01 コンセプト（セクション扉）
function slide03Section01() {
  return `<section class="slide" data-section="s01">
  <div class="s-section">
    <div class="s-section-main">
      <span class="s-section-num-main">01</span>
      <div class="s-section-divider"></div>
      <div class="s-section-text-col">
        <span class="s-section-label">ブランドコンセプト</span>
        <h2 class="s-section-name">CONCEPT</h2>
      </div>
    </div>
    <p class="slide-copy">©CRATER Inc.</p>
  </div>
</section>`;
}

// P4: コンセプト本文
function slide04Concept() {
  return `<section class="slide" data-section="concept">
  <div class="s-stmt">
    <div class="s-stmt-top"><span class="badge">CONCEPT</span></div>
    <div class="s-stmt-main">
      <h2 class="s-stmt-heading">輝きは、<br>準備から始まる。</h2>
      <p class="s-stmt-body">
        治すためでも、予防するためでもない。<br>
        この先の人生をもっと輝かせるための、日々の小さな準備。<br><br>
        KINJIは、その習慣をもっと気軽に、もっとスタイリッシュに。<br>
        20代でも、30代でも、40代でも——<br>
        いつ始めても、今日が一番早い。
      </p>
    </div>
    <p class="slide-copy">©CRATER Inc.</p>
  </div>
</section>`;
}

// P5: 02 ターゲット（セクション扉）
function slide05Section02() {
  return `<section class="slide" data-section="s02">
  <div class="s-section">
    <div class="s-section-main">
      <span class="s-section-num-main">02</span>
      <div class="s-section-divider"></div>
      <div class="s-section-text-col">
        <span class="s-section-label">ターゲットと立ち位置</span>
        <h2 class="s-section-name">TARGET</h2>
      </div>
    </div>
    <p class="slide-copy">©CRATER Inc.</p>
  </div>
</section>`;

  { id: 'closing',     label: 'クロージング' },
];

<script>
(function () {
  var stage     = document.getElementById('slide-stage');
  var menuBtn   = document.getElementById('menu-btn');
  var overlay   = document.getElementById('sidebar-overlay');
  var sideClose = document.getElementById('sidebar-close');
  var sideList  = document.getElementById('sidebar-list');
  var progress  = document.getElementById('progress-bar');
  var navPrev   = document.getElementById('nav-prev');
  var navNext   = document.getElementById('nav-next');
  var current   = 0;
  var total     = slideFactories.length;
  var rendered  = {};
  var currentScale = 1;

  function scaleSlides() {
    currentScale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.querySelectorAll('.slide').forEach(function (s) {
      s.style.transform = 'translate(-50%, -50%) scale(' + currentScale + ')';
    });
    var artW = 1920 * currentScale;
    var artH = 1080 * currentScale;
    var ox = (window.innerWidth  - artW) / 2;
    var oy = (window.innerHeight - artH) / 2;
    var margin = 46.08 * currentScale;
    menuBtn.style.top   = (oy + margin) + 'px';
    menuBtn.style.right = (ox + margin) + 'px';
  }
  window.addEventListener('resize', scaleSlides);

  function ensureRendered(i) {
    if (rendered[i] || i < 0 || i >= total) return;
    var frag = document.createRange().createContextualFragment(slideFactories[i]());
    var el = frag.querySelector('.slide');
    if (el) el.setAttribute('data-index', i);
    stage.appendChild(frag);
    rendered[i] = true;
    scaleSlides();
  }

  function getSlide(i) {
    return stage.querySelector('.slide[data-index="' + i + '"]');
  }

  function goTo(i, skipHash) {
    if (i < 0 || i >= total) return;
    [i - 1, i, i + 1].forEach(function (j) { ensureRendered(j); });
    var prev = getSlide(current);
    if (prev) prev.classList.remove('active');
    current = i;
    var cur = getSlide(current);
    if (cur) cur.classList.add('active');
    progress.style.width = ((current + 1) / total * 100) + '%';
    document.querySelectorAll('.sidebar-item').forEach(function (btn, idx) {
      btn.classList.toggle('active', idx === current);
    });
    if (!skipHash) history.replaceState(null, '', '#' + (i + 1));
  }

  agendaItems.forEach(function (item, i) {
    var btn = document.createElement('button');
    btn.className = 'sidebar-item';
    btn.innerHTML = '<span class="sidebar-num">' + (i + 1) + '</span>' + item.label;
    btn.addEventListener('click', function () {
      goTo(i);
      overlay.classList.remove('open');
    });
    sideList.appendChild(btn);
  });

  menuBtn.addEventListener('click', function () { overlay.classList.add('open'); });
  sideClose.addEventListener('click', function () { overlay.classList.remove('open'); });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) overlay.classList.remove('open');
  });

  navNext.addEventListener('click', function () { goTo(current + 1); });
  navPrev.addEventListener('click', function () { goTo(current - 1); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') goTo(current + 1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp') goTo(current - 1);
  });

  var initPage = 0;
  var hash = parseInt(location.hash.replace('#', ''), 10);
  if (!isNaN(hash) && hash >= 1 && hash <= total) initPage = hash - 1;

  scaleSlides();
  [0, 1, 2].forEach(function (i) { ensureRendered(i); });
  goTo(initPage, true);
})();
</script>
