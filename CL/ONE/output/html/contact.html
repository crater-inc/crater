  <section class="page-body"><div class="wrap">
    <form class="form">
      <div class="steps"><div class="st on"><div class="n">1</div><span>入力</span></div><div class="bar"></div><div class="st"><div class="n">2</div><span>確認</span></div><div class="bar"></div><div class="st"><div class="n">3</div><span>完了</span></div></div>
      <div class="field"><label>お問合せ種別<span class="req">必須</span></label><select><option>選択してください</option><option>物件購入</option><option>賃貸</option><option>売却・査定</option><option>その他</option></select></div>

      <div class="field"><label>フリガナ<span class="req">必須</span></label><input type="text" placeholder="ヤマダ タロウ"></div>
      <div class="field"><label>電話番号<span class="req">必須</span></label><input type="tel" placeholder="000-0000-0000"></div>
      <div class="field"><label>メールアドレス<span class="req">必須</span></label><input type="email" placeholder="example@mail.com"></div>
      <div class="field"><label>お問合せ内容<span class="req">必須</span></label><textarea placeholder="ご質問・ご相談内容をご記入ください"></textarea></div>
      <div class="agree"><input type="checkbox" id="ag"><label for="ag">個人情報の取り扱いに同意する</label></div>
      <div class="form-submit"><button type="button">入力内容を確認する<svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button></div>
