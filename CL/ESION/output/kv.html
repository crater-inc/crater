<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ESION KV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }

  .kv {
    width: 100%;
    aspect-ratio: 2418 / 1230;
    position: relative;
    overflow: hidden;
  }

  /* 背景 */
  .kv-bg {
    position: absolute;
    top: -2%;
    left: -100px;
    right: -2%;
    bottom: -2%;
    overflow: hidden;
    animation: bgScale 6s ease-in-out infinite;
    transform-origin: center center;
  }
  .kv-bg img {
    width: auto;
    height: 100%;
    min-width: 100%;
    object-fit: cover;
    display: block;
  }

  /* ボトル */
  .kv-bottle {
    position: absolute;
    left: 55.5%;
    top: 50%;
    height: 82%;
    width: auto;
    animation: float 3.5s ease-in-out infinite;
  }
  .kv-bottle img {
    height: 100%;
    width: auto;
    display: block;
  }

  /* テキスト */
  .kv-text {
    position: absolute;
    left: 15.5%;
    top: 50%;
    transform: translateY(-50%);
    width: 32%;
  }
  .kv-text img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* アニメーション */
  @keyframes float {
    0%, 100% { transform: translateY(-47%); }
    50%       { transform: translateY(calc(-47% - 18px)); }
  }

  @keyframes bgScale {
    0%, 100% { transform: scale(1.00); }
    50%       { transform: scale(1.04); }
  }
</style>
</head>
<body>

<div class="kv">
  <div class="kv-bg"><img src="../brief/KVweb/bg.jpg" alt=""></div>

  <div class="kv-text">
    <img src="../brief/KVweb/title.svg" alt="瞬感においわない オールインワンシャンプー">
  </div>

  <div class="kv-bottle">
    <img src="../brief/KVweb/KV2_0001_グループ-1.png" alt="ESION ボトル">
  </div>
</div>

</body>
</html>
