<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玉手箱 事業戦略の再定義</title>
  <link rel="stylesheet" href="https://use.typekit.net/qwe2tdt.css">
  <link rel="stylesheet" href="https://morisawafonts.net/c/01KSMBH35VT2E86JG92RAXZ7XC/mf.css">
  <script>
    (function(d) {
      var config = { kitId: 'qwe2tdt', scriptTimeout: 3000, async: true },
      h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s);
    })(document);
  </script>
  <style>
    :root {
      --c-base:   #DBDDDD;
      --c-black:  #000000;
      --c-text:   #000000;
      --c-sub:    #000000;
      --c-light:  #B0B0B0;
      --c-border: rgba(0,0,0,0.15);
      --font-en:  'urw-din', sans-serif;
      --font-ja:  'MFW-PA1GothicStdN-Regular', sans-serif;
      --font-ja-m: 'MFW-PA1GothicStdN-Medium', sans-serif;
      --font-ja-b: 'MFW-PA1GothicStdN-Bold', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #EBEBEB; overflow: hidden; }
    :lang(ja) { line-break: strict; }
    h1,h2,h3 { word-break: normal; overflow-wrap: normal; text-wrap: balance; }
    p, li { word-break: normal; overflow-wrap: normal; text-wrap: pretty; }

    .slide-stage { width: 100vw; height: 100vh; background: #EBEBEB; overflow: hidden; position: relative; }

    .slide {
      width: 1920px; height: 1080px;
      position: absolute; top: 50%; left: 50%;
      overflow: hidden; background: var(--c-base);
      container-type: inline-size; display: none;
      transform-origin: center center;
    }
    .slide.active { display: flex; flex-direction: column; }

    .badge {
      display: inline-flex; align-items: center;
      background: var(--c-black); color: #fff;
      font-family: var(--font-en); font-size: 0.85cqw; font-weight: 500;
      letter-spacing: 0.14em; padding: 0.55cqw 0.85cqw;
      border-radius: 0; line-height: 1;
    }

    .menu-btn {
      position: fixed; width: 36px; height: 36px; z-index: 300;
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    }
    .menu-btn span { display: block; width: 18px; height: 1px; background: #111; }
    .progress-bar { position: fixed; bottom: 0; left: 0; height: 2px; background: #111; transition: width 0.3s ease; z-index: 200; }
    .nav-prev, .nav-next { position: fixed; top: 0; width: 50%; height: 100%; z-index: 100; cursor: pointer; }
    .nav-prev { left: 0; } .nav-next { right: 0; }
    .status-bar { display: none; }

    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 400; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
    .sidebar { position: absolute; top: 0; right: -300px; bottom: 0; width: 280px; background: #2a2a2a; color: #fff; transition: right 0.3s ease; display: flex; flex-direction: column; }
    .sidebar-overlay.open .sidebar { right: 0; }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 24px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-logo { display: block; height: 14px; width: auto; filter: invert(1); opacity: 0.85; }
    .sidebar-close { background: none; border: none; color: rgba(255,255,255,0.3); font-size: 13px; cursor: pointer; }
    .sidebar-list { padding: 8px 0; flex: 1; overflow-y: auto; }
    .sidebar-item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 11px 24px; background: none; border: none; cursor: pointer; font-family: var(--font-ja-m); font-size: 11px; letter-spacing: 0.06em; color: rgba(255,255,255,0.35); text-align: left; transition: color 0.15s; }
    .sidebar-item:hover { color: rgba(255,255,255,0.7); }
    .sidebar-item.active { color: #fff; }
    .sidebar-num { font-family: var(--font-en); font-size: 10px; opacity: 0.25; min-width: 20px; }

    .em-line { position: relative; display: inline; background: linear-gradient(#FFE500, #FFE500) 0 0.8em / 100% 0.18em no-repeat; padding-bottom: 0; }
    .em-black { display: inline; background: var(--c-black); color: #ffffff; padding: 0.12em 0.12em; line-height: inherit; font-family: inherit; }
    .slide-copy { position: absolute; right: 2.4cqw; bottom: 2.4cqw; font-family: var(--font-en); font-size: 0.72cqw; letter-spacing: 0.08em; color: var(--c-sub); }

    /* ===== 表紙 ===== */
    .s-cover { height: 100%; padding: 6cqw 7cqw; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .s-cover-main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0.4cqw; }
    .s-cover-client { font-family: var(--font-ja-m); font-size: 1.5cqw; color: var(--c-sub); letter-spacing: 0.05em; }
    .s-cover-title { font-family: var(--font-ja-m); font-size: 4.6cqw; line-height: 1.18; letter-spacing: 0.04em; position: relative; left: -2px; }
    .s-cover-sub { font-family: var(--font-en); font-size: 1.2cqw; font-weight: 400; color: var(--c-sub); letter-spacing: 0.2em; margin-top: 0.9cqw; }
    .s-cover-footer { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 0.5cqw; }
    .s-cover-date { font-family: var(--font-en); font-size: 1cqw; letter-spacing: 0.12em; color: var(--c-text); }

    /* ===== セクション区切り ===== */
    .s-section { height: 100%; padding: 4cqw 7cqw 5cqw 7cqw; display: flex; flex-direction: column; position: relative; }
    .s-section-main { flex: 1; display: flex; align-items: center; gap: 0; }
    .s-section-num-col { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; }
    .s-section-num-main { font-family: var(--font-en); font-size: 7.2cqw; font-weight: 400; line-height: 1; letter-spacing: -0.04em; color: var(--c-text); }
    .s-section-divider { width: 1px; height: 5.5cqw; background: var(--c-border); flex-shrink: 0; margin: 0 2.5cqw; }
    .s-section-text-col { flex: 1; display: flex; flex-direction: column; gap: 0.7cqw; justify-content: center; }
    .s-section-label { font-family: var(--font-ja-m); font-size: 1.15cqw; letter-spacing: 0.1em; color: var(--c-sub); line-height: 1; padding-left: 4px; }
    .s-section-name { font-family: var(--font-en); font-size: 3.8cqw; font-weight: 500; line-height: 1; letter-spacing: 0.02em; }

    /* ===== ステートメント ===== */
    .s-stmt { height: 100%; padding: 4cqw 7cqw 5cqw 7cqw; display: flex; flex-direction: column; position: relative; }
    .s-stmt-top { position: absolute; top: calc(2.4cqw - 1px); left: 2.4cqw; }
    .s-stmt-main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.8cqw; }
    .s-stmt-heading { font-family: var(--font-ja-m); font-size: 4.4cqw; line-height: 1.22; letter-spacing: 0.04em; margin-left: -2px; }
    .s-stmt-body { font-family: var(--font-ja); font-size: 1.4cqw; line-height: 1.95; color: var(--c-sub); max-width: 58cqw; }

    /* ===== コピードン（中央強調） ===== */
    .s-copy-slide { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5cqw; position: relative; }
    .s-copy-slide-main { display: flex; flex-direction: column; align-items: center; gap: 2cqw; text-align: center; }
    .s-copy-slide-heading { font-family: var(--font-ja-m); font-size: 4.2cqw; line-height: 1.32; letter-spacing: 0.05em; color: var(--c-text); }
    .s-copy-slide-sub { font-family: var(--font-ja); font-size: 1.55cqw; line-height: 1.8; letter-spacing: 0.04em; color: var(--c-text); max-width: 60cqw; }

    /* ===== 箇条書き ===== */
    .s-bullet { height: 100%; padding: 4cqw 7cqw 5cqw 7cqw; display: flex; flex-direction: column; position: relative; }
    .s-bullet-top { position: absolute; top: calc(2.4cqw - 1px); left: 2.4cqw; z-index: 2; }
    .s-bullet-main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2.4cqw; }
    .s-bullet-heading { font-family: var(--font-ja-m); font-size: 3.4cqw; line-height: 1.25; letter-spacing: 0.04em; }
    .s-bullet-list { list-style: none; display: flex; flex-direction: column; gap: 0.4cqw; }
    .s-bullet-item { display: flex; align-items: baseline; gap: 1.2cqw; padding: 0.5cqw 0; }
    .s-bullet-icon { flex-shrink: 0; width: 1.4cqw; height: 1.4cqw; position: relative; top: 0.15cqw; }
    .s-bullet-icon svg { width: 100%; height: 100%; fill: var(--c-text); }
    .s-bullet-text { font-family: var(--font-ja); font-size: 1.45cqw; line-height: 1.65; color: var(--c-text); max-width: 74cqw; }
    .s-bullet-text b { font-family: var(--font-ja-b); }

    /* ===== 図解共通 ===== */
    .s-dgm { height: 100%; padding: 4cqw 7cqw 5cqw 7cqw; display: flex; flex-direction: column; position: relative; }
    .s-dgm-top { position: absolute; top: calc(2.4cqw - 1px); left: 2.4cqw; z-index: 2; }
    .s-dgm-main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 3cqw; }
    .s-dgm-head { font-family: var(--font-ja-m); font-size: 2.6cqw; line-height: 1.3; letter-spacing: 0.04em; }
    .s-dgm-note { font-family: var(--font-ja); font-size: 1.25cqw; line-height: 1.9; color: var(--c-sub); max-width: 62cqw; }

    .tb-box { background: #fff; border: 1px solid rgba(0,0,0,0.16); padding: 1.4cqw 1.8cqw; display: flex; flex-direction: column; gap: 0.35cqw; }
    .tb-box-en { font-family: var(--font-en); font-size: 0.72cqw; letter-spacing: 0.16em; color: #999; line-height: 1; }
    .tb-box-ja { font-family: var(--font-ja-m); font-size: 1.35cqw; line-height: 1.4; color: #111; }
    .tb-box-ja small { font-family: var(--font-ja); font-size: 0.95cqw; color: #555; }
    .tb-box--dark { background: #111; border-color: #111; }
    .tb-box--dark .tb-box-ja { color: #fff; }
    .tb-box--dark .tb-box-ja small { color: rgba(255,255,255,0.6); }
    .tb-box--dark .tb-box-en { color: rgba(255,255,255,0.45); }
    .tb-arrow { font-family: var(--font-en); font-size: 2cqw; color: #b0b0b0; flex-shrink: 0; line-height: 1; }
    .tb-mark { font-family: var(--font-ja-m); font-size: 1.1cqw; }
    .tb-mark-ng { color: #b03a2e; }
    .tb-mark-ok { color: #111; }

    /* イグジット課題フロー（横一列） */
    .tb-flow { display: flex; align-items: center; gap: 1.6cqw; }
    .tb-flow .tb-box { min-width: 13cqw; }

    /* 母体ツリー */
    .tb-tree { display: flex; align-items: center; gap: 2cqw; }
    .tb-branches { display: flex; flex-direction: column; gap: 0.9cqw; }
    .tb-branches .tb-box { min-width: 15cqw; padding: 0.9cqw 1.4cqw; }
    .tb-branches .tb-box-ja { font-size: 1.2cqw; }

    /* モンブラン縦フロー */
    .tb-steps { display: flex; align-items: stretch; gap: 1.2cqw; flex-wrap: nowrap; }
    .tb-step { flex: 1; background: #fff; border: 1px solid rgba(0,0,0,0.16); padding: 1.3cqw 1.2cqw; display: flex; flex-direction: column; gap: 0.5cqw; position: relative; }
    .tb-step-num { font-family: var(--font-en); font-size: 0.75cqw; letter-spacing: 0.16em; color: #999; }
    .tb-step-ja { font-family: var(--font-ja-m); font-size: 1.15cqw; line-height: 1.4; color: #111; }
    .tb-step--dark { background: #111; border-color: #111; }
    .tb-step--dark .tb-step-ja { color: #fff; }
    .tb-step--dark .tb-step-num { color: rgba(255,255,255,0.45); }
    .tb-step:not(:last-child)::after { content: '›'; position: absolute; right: -0.95cqw; top: 50%; transform: translateY(-50%); font-family: var(--font-en); font-size: 1.6cqw; color: #b0b0b0; z-index: 2; }

    /* ===== 締め ===== */
    .s-closing { height: 100%; padding: 4cqw 7cqw 5cqw 7cqw; display: flex; flex-direction: column; position: relative; }
    .s-closing-main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2cqw; }
    .s-closing-title { font-family: var(--font-ja-m); font-size: 3.2cqw; line-height: 1.3; letter-spacing: 0.04em; }
    .s-closing-sub { font-family: var(--font-en); font-size: 1cqw; letter-spacing: 0.2em; color: var(--c-sub); }
  </style>
</head>
<body>

<div class="slide-stage" id="slide-stage"></div>
<div class="nav-prev" id="nav-prev"></div>
<div class="nav-next" id="nav-next"></div>
<div class="status-bar" id="status-bar"></div>
<button class="menu-btn" id="menu-btn"><span></span><span></span><span></span></button>
<div class="progress-bar" id="progress-bar" style="width:0"></div>

<div class="sidebar-overlay" id="sidebar-overlay">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img class="sidebar-logo" src="assets/logo.svg" alt="CRATER">
      <button class="sidebar-close" id="sidebar-close">✕</button>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
  </nav>
</div>

<script>
window.bulletIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12,1.5A10.5,10.5,0,1,0,22.5,12,10.51,10.51,0,0,0,12,1.5ZM12,3A9,9,0,1,1,3,12,9,9,0,0,1,12,3Z"/><polygon points="10.5,16.5 6,12 8.25,10.5 10.5,12.75 15.75,6.75 18,9"/></svg>`;

// 01 表紙
function s01() {
  return `<section class="slide" data-section="cover">
  <div class="s-cover">
    <div class="s-cover-main">
      <p class="s-cover-client">玉手箱プロジェクト ／ 戦略会議</p>
      <h1 class="s-cover-title">事業戦略の、<br>再定義。</h1>
      <p class="s-cover-sub">TAMATEBAKO — STRATEGY MEMO</p>
    </div>
    <div class="s-cover-footer">
      <span class="s-cover-date">2026.07.15</span>
    </div>
  </div>
</section>`;
}

// 02 前提
function s02() {
  return `<section class="slide" data-section="premise">
  <div class="s-stmt">
    <div class="s-stmt-top"><span class="badge">PREMISE</span></div>
    <div class="s-stmt-main">
      <h2 class="s-stmt-heading">玉手箱とは、<br>「お重 × 中身」で売る会社。</h2>
      <p class="s-stmt-body">
        もともとは海外展開を前提に設計したビジネスモデル。お重の中に価値ある中身を入れて売る、ブランド兼・会社をつくる。まずは日本の百貨店ポップアップで実績をつくり、そこから海外へ広げていく。
      </p>
    </div>
    <p class="slide-copy">©CRATER Inc.</p>
  </div>
</section>`;
}

// 03 最終ゴール
function s03() {
  return `<section class="slide" data-section="goal">
  <div class="s-copy-slide">
    <div class="s-copy-slide-main">
      <p class="s-copy-slide-heading">つくるのは商品ではなく、<br>「売れる会社」。</p>
      <p class="s-copy-slide-sub">玉手箱の最終ゴールは、ブランドを育て、<span class="em-black">会社ごと売る（イグジット）</span>こと。<br>この一点から、今回の判断を組み立て直す。</p>
    </div>
    <p class="slide-copy">©CRATER Inc.</p>
  </div>
</section>`;
}

// 04 セクション01
function s04() {
  return `<section class="slide" data-section="sec1">
  <div class="s-section">
    <div class="s-section-main">
      <div class="s-section-num-col"><span class="s-section-num-main">01</span></div>
      <div class="s-section-divider"></div>
      <div class="s-section-text-col">
        <span class="s-section-label">今回の資料で決めること</span>
        <h2 class="s-section-name">REDEFINE</h2>
      </div>
    </div>
    <p class="slide-copy">©CRATER Inc.</p>
  </div>
</section>`;
}

// 05 再定義①
function s05() {
  return `<section class="slide" data-section="redef1">
  <div class="s-stmt">
    <div class="s-stmt-top"><span class="badge">REDEFINE 01</span></div>
    <div class="s-stmt-main">
      <h2 class="s-stmt-heading">百貨店ポップアップは、<br><span class="em-line">「実績づくり」</span>と再定義する。</h2>
      <p class="s-stmt-body">
        本番は海外展開。日本での百貨店ポップアップは、売上そのものより「やった実績」を積むことをメインの目的に置き直す。目的をここに定めると、この先の判断がぐっとシンプルになる。
      </p>
    </div>
    <p class="slide-copy">©CRATER Inc.</p>
  </div>
</section>`;
}

// 06 再定義②
function s06() {
  const icon = window.bulletIcon;
  return `<section class="slide" data-section="redef2">
  <div class="s-bullet">
    <div class="s-bullet-top"><span class="badge">REDEFINE 02</span></div>
    <div class="s-bullet-main">
      <h2 class="s-bullet-heading">お重の“こだわり”は、<br>いったん外す。</h2>
      <ul class="s-bullet-list">
        <li class="s-bullet-item"><span class="s-bullet-icon">${icon}</span><span class="s-bullet-text"><b>箱押し（型・箔押し）はやめる。</b>印刷コストが上がるだけで、実績づくりの段階では過剰。</span></li>
        <li class="s-bullet-item"><span class="s-bullet-icon">${icon}</span><span class="s-bullet-text"><b>お重を新調しても、差別化にならない。</b>モンブラン会社も、形は違うが「お重でモンブラン」を売っている。</span></li>
        <li class="s-bullet-item"><span class="s-bullet-icon">${icon}</span><span class="s-bullet-text"><b>実績づくりが目的なら、お重は今あるものでいい。</b>わざわざカスタムする必然性がない。</span></li>
        <li class="s-bullet-item"><span class="s-bullet-icon">${icon}</span><span class="s-bullet-text">→ <b>結論：今回はお重のカスタム・箱押しは不要。</b>コストを軽くして、実績を優先する。</span></li>
      </ul>
    </div>
    <p class="slide-copy">©CRATER Inc.</p>
  </div>
</section>`;
}

// 07 セクション02
function s07() {
  return `<section class="slide" data-section="sec2">
  <div class="s-section">
    <div class="s-section-main">
      <div class="s-section-num-col"><span class="s-section-num-main">02</span></div>
      <div class="s-section-divider"></div>
      <div class="s-section-text-col">
        <span class="s-section-label">会社をどう売るか</span>
        <h2 class="s-section-name">EXIT</h2>
      </div>
    </div>
    <p class="slide-copy">©CRATER Inc.</p>
  </div>
</section>`;
}

// 08 課題図
function s08() {
  return `<section class="slide" data-section="exit-issue">
  <div class="s-dgm">
    <div class="s-dgm-top"><span class="badge">EXIT — ISSUE</span></div>
    <div class="s-dgm-main">
      <h2 class="s-dgm-head">「箱の会社」としては、売りにくい。</h2>
      <div class="tb-flow">
        <div class="tb-box"><span class="tb-box-en">PRODUCT</span><span class="tb-box-ja">お重（箱そのもの）</span></div>
        <span class="tb-arrow">→</span>
        <div class="tb-box"><span class="tb-box-en">MADE BY</span><span class="tb-box-ja">OEM製造</span></div>
        <span class="tb-arrow">→</span>
        <div class="tb-box"><span class="tb-box-en">DIFFERENCE</span><span class="tb-box-ja">差別化は<br>“ちょっとしたデザイン”</span></div>
        <span class="tb-arrow">→</span>
        <div class="tb-box"><span class="tb-box-en">EXIT</span><span class="tb-box-ja"><span class="tb-mark tb-mark-ng">✕</span> 高く売るのは難しい</span></div>
      </div>
      <p class="s-dgm-note">お重はOEM。差別化と言っても、乗せられるのは“ちょっとしたデザイン”にとどまる。箱そのものを資産に会社を売るのは、どう考えても無理がある。</p>
    </div>
    <p class="slide-copy">©CRATER Inc.</p>
  </div>
</section>`;
}

// 09 解の図（母体）
function s09() {

<script>
(function () {
  var stage = document.getElementById('slide-stage');
  var menuBtn = document.getElementById('menu-btn');
  var overlay = document.getElementById('sidebar-overlay');
  var sideClose = document.getElementById('sidebar-close');
  var sideList = document.getElementById('sidebar-list');
  var progress = document.getElementById('progress-bar');
  var navPrev = document.getElementById('nav-prev');
  var navNext = document.getElementById('nav-next');
  var current = 0;
  var total = slideFactories.length;
  var rendered = {};
  var currentScale = 1;

  function scaleSlides() {
    currentScale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.querySelectorAll('.slide').forEach(function (s) {
      s.style.transform = 'translate(-50%, -50%) scale(' + currentScale + ')';
    });
    var artW = 1920 * currentScale, artH = 1080 * currentScale;
    var ox = (window.innerWidth - artW) / 2, oy = (window.innerHeight - artH) / 2;
    var margin = 46.08 * currentScale;
    menuBtn.style.top = (oy + margin) + 'px';
    menuBtn.style.right = (ox + margin) + 'px';
  }
  window.addEventListener('resize', scaleSlides);

  function ensureRendered(i) {
    if (rendered[i] || i < 0 || i >= total) return;
    var frag = document.createRange().createContextualFragment(slideFactories[i]());
    var el = frag.querySelector('.slide');
    if (el) el.setAttribute('data-index', i);
    stage.appendChild(frag);
    rendered[i] = true;
    scaleSlides();
  }
  function getSlide(i) { return stage.querySelector('.slide[data-index="' + i + '"]'); }

  function goTo(i, skipHash) {
    if (i < 0 || i >= total) return;
    [i - 1, i, i + 1].forEach(function (j) { ensureRendered(j); });
    stage.querySelectorAll('.slide').forEach(function (s) { s.classList.remove('active'); });
    var target = getSlide(i);
    if (target) target.classList.add('active');
    current = i;
    if (!skipHash) history.replaceState(null, '', '#' + (i + 1));
    progress.style.width = ((i + 1) / total * 100) + '%';
    document.querySelectorAll('.sidebar-item').forEach(function (el, idx) { el.classList.toggle('active', idx === i); });
  }

  var initPage = 0;
  var hash = window.location.hash.replace('#', '');
  if (hash && !isNaN(hash)) { var p = parseInt(hash, 10) - 1; if (p >= 0 && p < total) initPage = p; }
  scaleSlides();
  [0, 1, 2].forEach(function (i) { ensureRendered(i); });
  goTo(initPage, true);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goTo(current + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); goTo(current - 1); }
    if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    if (e.key === 'End') { e.preventDefault(); goTo(total - 1); }
    if (e.key === 'Escape') { overlay.classList.remove('open'); }
  });
  navPrev.addEventListener('click', function () { goTo(current - 1); });
  navNext.addEventListener('click', function () { goTo(current + 1); });
  menuBtn.addEventListener('click', function () { overlay.classList.toggle('open'); });
  sideClose.addEventListener('click', function () { overlay.classList.remove('open'); });
  overlay.addEventListener('click', function (e) { if (!e.target.closest('.sidebar')) overlay.classList.remove('open'); });

  agendaItems.forEach(function (item, i) {
    var btn = document.createElement('button');
    btn.className = 'sidebar-item';
    btn.innerHTML = '<span class="sidebar-num">' + String(i + 1).padStart(2, '0') + '</span><span>' + item.label + '</span>';
    btn.addEventListener('click', function (e) { e.stopPropagation(); goTo(i); overlay.classList.remove('open'); });
    sideList.appendChild(btn);
  });
})();
</script>
