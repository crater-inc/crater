<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APOLLOS</title>
<style>
/* ===== ベース ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: auto; }
body {
  overflow-x: hidden;
  background: #02040a;
  color: rgba(255,255,255,0.85);
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ===== スクロール領域（進捗計測用に縦長） ===== */
.scroll-stage {
  position: relative;
  height: 400vh;
}

/* ===== 画面固定ステージ ===== */
.viewport {
  position: sticky;
  top: 0;
  height: 100vh;
  width: 100%;
  overflow: hidden;
  background: #02040a;
}

/* ===== 背景レイヤー共通 ===== */
.layer {
  position: absolute;
  inset: 0;
  will-change: transform, opacity;
}

/* 最奥：星空 */
.layer-stars { opacity: 0; }
.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  animation: twinkle 4s infinite ease-in-out;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.9; }
}

/* 月（右上の淡いグレー円） */
.layer-moon { opacity: 0; }
.moon {
  position: absolute;
  top: 12%;
  right: 14%;
  width: clamp(60px, 8vw, 120px);
  height: clamp(60px, 8vw, 120px);
  border-radius: 50%;
  background: radial-gradient(circle at 38% 35%, #e8eaef 0%, #aeb4c0 55%, #7c8290 100%);
  box-shadow: 0 0 60px rgba(200,210,230,0.25);
}

/* 地球の輪郭（画面下部・大きな円の上端＋大気光） */
.layer-earth { opacity: 0; }
.earth {
  position: absolute;
  left: 50%;
  bottom: -130%;
  transform: translateX(-50%);
  width: 220%;
  height: 220%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 18%, #0a2240 0%, #061528 40%, #02040a 70%);
  box-shadow:
    0 -8px 50px rgba(80,150,255,0.35),
    inset 0 18px 60px rgba(120,180,255,0.20);
}
.earth::after {
  /* 上端の大気光の弧 */
  content: "";
  position: absolute;
  left: 0; right: 0; top: -4px;
  height: 14%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 100%, rgba(120,190,255,0.55) 0%, rgba(120,190,255,0.0) 60%);
  filter: blur(6px);
}

/* 大気圏の青い弧（画面下から立ち上がる光） */
.layer-atmosphere { opacity: 0; }
.atmosphere {
  position: absolute;
  left: 50%;
  bottom: -60%;
  transform: translateX(-50%);
  width: 180%;
  height: 120%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 0%, rgba(90,170,255,0.45) 0%, rgba(60,120,220,0.18) 35%, rgba(0,0,0,0) 60%);
  filter: blur(8px);
}

/* 雲（黒い雲・奥に微かな光） */
.layer-clouds { opacity: 1; }
.cloud-glow {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 70vw; height: 70vw;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(120,140,180,0.18) 0%, rgba(0,0,0,0) 60%);
}
.cloud {
  position: absolute;
  top: 50%;
  width: 90vw;
  height: 140vh;
  transform: translateY(-50%);
  filter: blur(2px);
}
.cloud-left {
  left: -10vw;
  background: radial-gradient(ellipse 60% 50% at 70% 50%, #14161c 0%, #0a0b10 45%, rgba(2,4,10,0) 72%);
}
.cloud-right {
  right: -10vw;
  background: radial-gradient(ellipse 60% 50% at 30% 50%, #14161c 0%, #0a0b10 45%, rgba(2,4,10,0) 72%);
}
.cloud-center {
  left: 50%;
  width: 120vw;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse 50% 45% at 50% 50%, #0c0e13 0%, #06070c 55%, rgba(2,4,10,0) 80%);
}

/* ===== ロゴ（中央・①②で表示） ===== */
.center-logo {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 5;
  font-size: clamp(26px, 5vw, 60px);
  letter-spacing: 0.42em;
  font-weight: 300;
  color: rgba(255,255,255,0.9);
  text-indent: 0.42em;
  white-space: nowrap;
}

/* ===== タグライン（③④） ===== */
.tagline {
  position: absolute;
  left: 50%; top: 46%;
  transform: translate(-50%, -50%);
  z-index: 5;
  text-align: center;
  width: 90%;
  opacity: 0;
}
.tagline .jp {
  font-size: clamp(22px, 4vw, 48px);
  font-weight: 300;
  letter-spacing: 0.12em;
  line-height: 1.7;
  color: rgba(255,255,255,0.92);
}
.tagline .en {
  margin-top: 1.6em;
  font-size: clamp(11px, 1.3vw, 14px);
  letter-spacing: 0.4em;
  text-indent: 0.4em;
  color: rgba(255,255,255,0.7);
}

/* ===== ヘッダー（④で出現） ===== */
.site-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: clamp(20px, 3vw, 36px) clamp(24px, 5vw, 60px);
  opacity: 0;
  transform: translateY(-16px);
  pointer-events: none;
}
.site-header .brand {
  font-size: clamp(15px, 1.8vw, 20px);
  letter-spacing: 0.32em;
  text-indent: 0.32em;
  font-weight: 300;
  color: rgba(255,255,255,0.9);
}
.site-nav { display: flex; gap: clamp(18px, 3vw, 40px); }
.site-nav a {
  font-size: clamp(11px, 1.2vw, 13px);
  letter-spacing: 0.26em;
  text-indent: 0.26em;
  color: rgba(255,255,255,0.72);
  text-decoration: none;
  transition: color 0.3s ease;
}
.site-nav a:hover { color: rgba(255,255,255,1); }

/* ===== スクロール誘導（④） ===== */
.scroll-cue {
  position: absolute;
  left: 50%; bottom: clamp(28px, 5vh, 56px);
  transform: translateX(-50%);
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  opacity: 0;
}
.scroll-cue span {
  font-size: 10px;
  letter-spacing: 0.4em;
  text-indent: 0.4em;
  color: rgba(255,255,255,0.65);
}
.scroll-cue .arrow {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, rgba(255,255,255,0.7), rgba(255,255,255,0));
  animation: cueMove 2s infinite ease-in-out;
}
@keyframes cueMove {
  0%, 100% { transform: translateY(0); opacity: 0.5; }
  50% { transform: translateY(8px); opacity: 1; }
}

/* ===== レスポンシブ ===== */
@media (max-width: 768px) {
  /* SP：演出破綻を防ぐため雲サイズ・動き量を抑える */
  .cloud { width: 130vw; }
  .moon { top: 10%; right: 10%; }
  .center-logo { letter-spacing: 0.3em; text-indent: 0.3em; }
  .tagline .jp { line-height: 1.6; }
  .site-header { padding: 18px 24px; }
  .site-nav { gap: 16px; }
}
</style>
</head>
<body>

<div class="scroll-stage" id="scrollStage">
  <div class="viewport">

    <!-- 背景レイヤー（最奥→手前） -->
    <div class="layer layer-stars" id="stars"></div>
    <div class="layer layer-moon" id="moon"><div class="moon"></div></div>
    <div class="layer layer-earth" id="earth"><div class="earth"></div></div>
    <div class="layer layer-atmosphere" id="atmosphere"><div class="atmosphere"></div></div>
    <div class="layer layer-clouds" id="clouds">
      <div class="cloud-glow"></div>
      <div class="cloud cloud-center" id="cloudCenter"></div>
      <div class="cloud cloud-left" id="cloudLeft"></div>
      <div class="cloud cloud-right" id="cloudRight"></div>
    </div>

    <!-- 中央ロゴ（①②） -->
    <div class="center-logo" id="centerLogo">APOLLOS</div>

    <!-- タグライン（③④） -->
    <div class="tagline" id="tagline">
      <div class="jp">埋もれている価値を、次の世界へ。</div>
      <div class="en">FROM THE UNSEEN TO THE NEXT WORLD</div>
    </div>

    <!-- スクロール誘導（④） -->
    <div class="scroll-cue" id="scrollCue">
      <span>SCROLL</span>
      <div class="arrow"></div>
    </div>

  </div>
</div>

<!-- ④で出現するヘッダー -->
<header class="site-header" id="siteHeader">
  <div class="brand">APOLLOS</div>
  <nav class="site-nav">
    <a href="#about">ABOUT</a>
    <a href="#service">SERVICE</a>
    <a href="#contact">CONTACT</a>
  </nav>
</header>

<script>
// ===== 星空を生成 =====
(function makeStars() {
  const stars = document.getElementById('stars');
  const isMobile = window.innerWidth <= 768;
  const count = isMobile ? 60 : 120; // SP：星の数を減らす
  let html = '';
  for (let i = 0; i < count; i++) {
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const d = (Math.random() * 4).toFixed(2);
    const s = (Math.random() * 1.5 + 0.6).toFixed(2);
    html += `<div class="star" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-delay:${d}s"></div>`;
  }
  stars.innerHTML = html;
})();

// ===== スクロール進捗 → 4幕演出 =====
const stage       = document.getElementById('scrollStage');
const clouds      = document.getElementById('clouds');
const cloudCenter = document.getElementById('cloudCenter');
const cloudLeft   = document.getElementById('cloudLeft');
const cloudRight  = document.getElementById('cloudRight');
const atmosphere  = document.getElementById('atmosphere');
const earth       = document.getElementById('earth');
const moon        = document.getElementById('moon');
const stars       = document.getElementById('stars');
const centerLogo  = document.getElementById('centerLogo');
const tagline     = document.getElementById('tagline');
const scrollCue   = document.getElementById('scrollCue');
const siteHeader  = document.getElementById('siteHeader');

const isMobile = window.innerWidth <= 768;
const MOVE = isMobile ? 0.55 : 1; // SP：視差の移動量を抑える係数

function clamp(v) { return Math.max(0, Math.min(1, v)); }
function range(p, a, b) { return clamp((p - a) / (b - a)); }

function update() {
  const stageHeight = stage.offsetHeight - window.innerHeight;
  const p = clamp(window.scrollY / stageHeight); // 全体進捗 0〜1

  // --- ① 雲の中（0〜0.25）：雲が画面を覆う・ロゴ静かに ---
  const logoOut = range(p, 0.30, 0.45);
  centerLogo.style.opacity = (1 - logoOut).toFixed(3);
  centerLogo.style.transform =
    `translate(-50%, calc(-50% - ${(logoOut * 30).toFixed(1)}px))`;

  // --- ② 雲が分かれる（0.25〜0.5）：左右に割れて流れる ---
  const split = range(p, 0.20, 0.55);
  cloudCenter.style.opacity = (1 - range(p, 0.18, 0.42)).toFixed(3);
  const shift = split * 80 * MOVE;
  cloudLeft.style.transform  = `translate(${-shift}vw, -50%)`;
  cloudRight.style.transform = `translate(${shift}vw, -50%)`;
  clouds.style.opacity = (1 - range(p, 0.45, 0.62)).toFixed(3);

  // --- ③ 大気圏突破（0.5〜0.75）：青い弧が現れる・タグラインIN ---
  const atmoIn = range(p, 0.45, 0.66);
  atmosphere.style.opacity = atmoIn.toFixed(3);
  atmosphere.style.transform =
    `translateX(-50%) scale(${(0.85 + atmoIn * 0.3).toFixed(3)})`;

  const taglineIn = range(p, 0.52, 0.74);
  tagline.style.opacity = taglineIn.toFixed(3);
  tagline.style.transform =
    `translate(-50%, calc(-50% + ${((1 - taglineIn) * 26).toFixed(1)}px))`;

  // --- ④ 宇宙着地（0.75〜1）：地球・月・星空・ヘッダー・SCROLL ---
  const space = range(p, 0.68, 0.92);
  stars.style.opacity = space.toFixed(3);
  earth.style.opacity = range(p, 0.70, 0.95).toFixed(3);
  earth.style.transform = `translateY(${(-space * 14 * MOVE).toFixed(1)}vh)`;
  moon.style.opacity = range(p, 0.78, 1.0).toFixed(3);

  const headIn = range(p, 0.80, 0.96);
  siteHeader.style.opacity = headIn.toFixed(3);
  siteHeader.style.transform = `translateY(${((1 - headIn) * -16).toFixed(1)}px)`;
  siteHeader.style.pointerEvents = headIn > 0.5 ? 'auto' : 'none';

  scrollCue.style.opacity = range(p, 0.82, 1.0).toFixed(3);
}

let ticking = false;
function onScroll() {
  if (!ticking) {
    requestAnimationFrame(() => { update(); ticking = false; });
    ticking = true;
  }
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', update);
update();
</script>

</body>
</html>
