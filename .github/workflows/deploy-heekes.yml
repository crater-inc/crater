name: Deploy HEEKES

# heekes.jp（自社ConoHaサーバー）へ静的サイトをFTPデプロイする。
# heekes-html/ 以下を変更してpushすると自動で反映される。
on:
  push:
    branches: [main]
    paths:
      - "CL/ライフギアジャパン/ブランドサイト/heekes-html/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: サイト本体をデプロイ
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.HEEKES_FTP_HOST }}
          username: ${{ secrets.HEEKES_FTP_USERNAME }}
          password: ${{ secrets.HEEKES_FTP_PASSWORD }}
          # FTPアカウントの接続許可ディレクトリを public_html/heekes.jp に
          # 限定しているため、FTPのルート（./）がそのままサイトの公開領域になる
          local-dir: CL/ライフギアジャパン/ブランドサイト/heekes-html/
          server-dir: ./
          state-name: .ftp-deploy-heekes.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store

      - name: .htaccess を配置（拡張子なしURL・リダイレクト用・単体アップ）
        run: |
          curl -sS --ftp-create-dirs -T "CL/ライフギアジャパン/ブランドサイト/heekes-html/.htaccess" \
            "ftp://${{ secrets.HEEKES_FTP_HOST }}/.htaccess" \
            --user "${{ secrets.HEEKES_FTP_USERNAME }}:${{ secrets.HEEKES_FTP_PASSWORD }}"
          echo ".htaccess uploaded"
