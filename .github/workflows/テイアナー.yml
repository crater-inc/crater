name: テイアナー

# まずは手動実行（テスト）だけ。LINE配信が確認できたら2日に1回の自動配信をここに追加する。
on:
  workflow_dispatch: {}   # 手動実行（gh workflow run または GitHub画面のRun workflow）

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Claude Codeインストール
        run: npm install -g @anthropic-ai/claude-code

      - name: テイアナーを生成（Sonnet・検索5回まで・クレジット最小）
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date '+%Y-%m-%d (%a)')
          PROMPT="今日は ${TODAY} です。$(cat "01_CRATER/_SERVICE/テイアナー配信/テイアナープロンプト.md")"
          claude -p "$PROMPT" --model sonnet --allowedTools "WebSearch" --max-turns 15 > テイアナー.txt
          echo "---- 生成結果 ----"
          cat テイアナー.txt

      - name: クロタ（LINE）に送信
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          jq -n --arg to "$LINE_USER_ID" --rawfile text テイアナー.txt \
            '{to:$to, messages:[{type:"text", text:($text | .[0:4900])}]}' \
          | curl -sS -X POST https://api.line.me/v2/bot/message/push \
              -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-
