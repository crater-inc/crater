name: 朝刊プロポーザー

# 2日に1回（奇数日）朝9:00(JST) に自動配信（UTCでは0:00）
on:
  schedule:
    - cron: "0 0 1-31/2 * *"
  workflow_dispatch: {}   # 手動実行も可能（テスト用）

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Claude Codeインストール
        run: npm install -g @anthropic-ai/claude-code

      - name: 朝刊を生成（Sonnet・検索5回まで・クレジット最小）
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date '+%Y-%m-%d (%a)')
          PROMPT="今日は ${TODAY} です。$(cat "01_CRATER/_SERVICE/朝刊プロポーザー/朝刊プロンプト.md")"
          claude -p "$PROMPT" --model sonnet --allowedTools "WebSearch" --max-turns 15 > 朝刊.txt
          echo "---- 生成結果 ----"
          cat 朝刊.txt

      - name: LINEに送信
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          jq -n --arg to "$LINE_USER_ID" --rawfile text 朝刊.txt \
            '{to:$to, messages:[{type:"text", text:($text | .[0:4900])}]}' \
          | curl -sS -X POST https://api.line.me/v2/bot/message/push \
              -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-
