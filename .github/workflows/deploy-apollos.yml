name: Deploy APOLLOS (静的・停止中)

# WordPress移行のため自動デプロイを停止（静的サイトがWPを上書きしないように）。
# 必要時のみ手動実行。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTPデプロイ
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: 02_APOLLOS/output/website/
          server-dir: public_html/apollos.jp/
