<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>VIEW管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }

    :root {
      --side-w: 264px;                       /* 左の一覧の幅 */
      --side-bg: #111;                       /* 左の一覧の背景 */
      --side-hover: #1f1f1f;
      --side-active: #2c2c2c;
      --side-text: rgba(255, 255, 255, 0.88);
      --side-sub: rgba(255, 255, 255, 0.65); /* グループ名など */
      --side-line: rgba(255, 255, 255, 0.1);
      --main-bg: #fff;                       /* 右側の背景（白） */
    }

    html, body { height: 100%; }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
      font-size: 16px;
      background: var(--main-bg);
      color: var(--side-text);
      overflow-x: hidden;
    }

    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    /* キーボード操作時の目印（黒い画面で浮かないよう、白の細枠を内側に） */
    button:focus-visible, a:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.4); outline-offset: -1px; }

    /* ===== パスワード画面（viewトップと同じ見た目） ===== */
    .lock-screen {
      position: fixed;
      inset: 0;
      background: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .lock-screen .inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .lock-screen .path {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #111;
    }

    .lock-screen .logo {
      font-size: 11px;
      letter-spacing: 0.3em;
      color: #333;
    }

    .lock-screen input {
      background: #666;
      border: 1px solid #777;
      border-radius: 4px;
      padding: 12px 16px;
      font-size: 16px;
      color: #fff;
      width: 240px;
      text-align: center;
      letter-spacing: 0.1em;
      outline: none;
    }

    .lock-screen button {
      background: #111;
      color: #888;
      border-radius: 100px;
      padding: 11px 0;
      width: 240px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.15em;
    }

    .lock-screen .error {
      font-size: 12px;
      color: #c0392b;
    }

    /* ===== 全体：左に一覧、右に表示 ===== */
    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
    }

    /* ===== 左：ページ一覧 ===== */
    .sidebar {
      width: var(--side-w);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--side-bg);
      color: var(--side-text);
    }

    .app.is-collapsed .sidebar { display: none; }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 18px 12px 16px 20px;
      border-bottom: 1px solid var(--side-line);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .brand-logo {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--side-sub);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #fff;
    }

    .site-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px 32px;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    /* ===== 検索 ===== */
    .search { padding: 12px 10px 4px; }

    .search-box {
      position: relative;
      display: block;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: var(--side-sub);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      font: inherit;
      font-size: 16px;
      color: #fff;
      background: #1c1c1c;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .search-box input::placeholder { color: var(--side-sub); }
    .search-box input:focus { border-color: rgba(255, 255, 255, 0.35); }

    /* 入力を消す×ボタン（ブラウザ標準の青をグレーに） */
    .search-box input::-webkit-search-cancel-button {
      filter: grayscale(1) brightness(2);
      cursor: pointer;
    }

    .search-status {
      padding: 8px 10px 0;
      font-size: 12px;
      color: var(--side-sub);
    }

    /* 検索中は、閉じているグループも開いて当たったページを見せる */
    .site-nav.is-searching .group.is-closed .group-list { display: flex; }

    .group + .group { margin-top: 14px; }

    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--side-sub);
      text-align: left;
    }

    .group-head:hover { color: #fff; }

    .chevron { flex-shrink: 0; transition: transform 0.2s; }
    .group.is-closed .chevron { transform: rotate(-90deg); }
    .group.is-closed .group-list { display: none; }

    .group-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 2px;
    }

    .site {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--side-text);
      text-align: left;
    }

    .site:hover { background: var(--side-hover); }
    .site.is-active { background: var(--side-active); color: #fff; }

    /* 長い名前は2行まで（それ以上は…で省略） */
    .site-name {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .ext-icon { flex-shrink: 0; margin: 4px 0 0 auto; color: var(--side-sub); }

    /* ページ名の頭の絵文字アイコン（名前の1行目の高さにそろえる） */
    .site-icon {
      flex-shrink: 0;
      width: 20px;
      font-size: 15px;
      line-height: 21px;
      text-align: center;
    }

    .site-text {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    /* 本文で当たった部分（名前の下に小さく出す） */
    .site-snippet {
      font-size: 12px;
      line-height: 1.5;
      color: var(--side-sub);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .site-snippet mark {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 2px;
    }

    /* ===== 右：選んだページを表示 ===== */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      flex-shrink: 0;
      padding: 0 12px 0 16px;
      background: var(--side-bg);
      border-bottom: 1px solid var(--side-line);
    }

    .current {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .current-group {
      flex-shrink: 0;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--side-sub);
    }

    .current-name {
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .topbar-actions { display: flex; gap: 4px; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      color: var(--side-sub);
    }

    .icon-btn:hover { background: var(--side-hover); color: #fff; }

    /* 一覧を出すボタン：PCでは一覧をしまった時だけ出す */
    .open-btn { display: none; }
    .app.is-collapsed .open-btn { display: inline-flex; }

    /* 閉じるボタンのアイコン：PC＝パネル、スマホ＝× */
    .icon-close { display: none; }

    .viewer {
      position: relative;
      flex: 1;
      background: #fff;
    }

    .viewer iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      font-size: 14px;
      color: #555;
      text-align: center;
      background: var(--main-bg);
    }

    /* 読み込み中の細いバー */
    .viewer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      width: 0;
      height: 2px;
      background: #111;
      opacity: 0;
    }

    .viewer.is-loading::before {
      opacity: 1;
      animation: loading 1.2s ease-out infinite;
    }

    @keyframes loading {
      from { width: 0; }
      to { width: 100%; }
    }

    /* ===== 左の一番上：トップへのリンク ===== */
    .home-link-wrap { padding: 8px 10px 0; }

    /* ===== トップ（view全体の最近の更新）・白背景 ===== */
    .top-view {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow-y: auto;
      background: #fff;
      color: #333;
    }

    .top-inner {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 40px 80px;
    }

    .top-kicker {
      font-size: 11px;
      letter-spacing: 0.25em;
      color: #888;
    }

    .top-title {
      margin-top: 6px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #111;
    }

    .top-lead {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    .top-day { margin-top: 36px; }

    .top-day-label {
      padding-bottom: 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #555;
      border-bottom: 1px solid #e6e6e6;
    }

    .top-row {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 16px;
      width: 100%;
      padding: 14px 10px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
    }

    .top-row:hover { background: #f7f7f7; }

    .top-time {
      padding-top: 2px;
      font-size: 13px;
      color: #777;
      font-variant-numeric: tabular-nums;
    }

    .top-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .top-name-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 10px;
    }

    .top-name {
      font-size: 16px;
      font-weight: 600;
      color: #111;
      overflow-wrap: anywhere;
    }

    .top-project {
      padding: 2px 8px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: #555;
      background: #f1f1f1;
      border-radius: 4px;
    }

    /* 同じ変更でまとめて更新されたページの数（「ほか7ページ」） */
    .top-others {
      font-size: 12px;
      color: #777;
    }

    .top-others:empty { display: none; }

    .top-note {
      font-size: 14px;
      color: #555;
      overflow-wrap: anywhere;
    }

    .top-more {
      margin-top: 28px;
      padding: 10px 20px;
      font-size: 14px;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 999px;
    }

    .top-more:hover { background: #f7f7f7; }

    .overlay { display: none; }

    /* ===== スマホ：一覧は左から引き出す ===== */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 30;
        width: min(84vw, 320px);
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }

      .app.is-collapsed .sidebar { display: flex; }
      .app.is-drawer-open .sidebar { transform: none; }

      .overlay {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }

      .app.is-drawer-open .overlay { opacity: 1; pointer-events: auto; }

      .open-btn { display: inline-flex; }
      .icon-panel { display: none; }
      .icon-close { display: block; }

      .topbar { padding: 0 8px; }
      .site { padding: 12px; }

      .top-inner { padding: 32px 32px 64px; }
      .top-row { grid-template-columns: 44px 1fr; gap: 12px; padding: 12px 4px; }
    }
  </style>
</head>
<body>

  <!-- パスワード画面 -->
  <div class="lock-screen" id="lockScreen">
    <div class="inner">
      <div class="path">CRATER / VIEW管理</div>
      <input type="password" id="passwordInput" placeholder="PASSWORD" autocomplete="current-password" autofocus>
      <button type="button" id="enterBtn">ENTER</button>
      <div class="error" id="errorMsg" hidden>パスワードが違います</div>
      <div class="logo">CRATER INC.</div>
    </div>
  </div>

  <div class="app" id="app" hidden>

    <!-- 左：ページ一覧（中身は ページ一覧.js から作る） -->
    <aside class="sidebar" aria-label="ページ一覧">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-logo">CRATER INC.</span>
          <span class="brand-title">VIEW管理</span>
        </div>
        <button type="button" class="icon-btn" id="closeBtn" aria-label="一覧をしまう" title="一覧をしまう">
          <svg class="icon-panel" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
          <svg class="icon-close" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="search">
        <label class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="searchInput" placeholder="ページ・本文を検索" autocomplete="off" aria-label="ページ名・見出し・本文を検索">
        </label>
        <p class="search-status" id="searchStatus" hidden></p>
      </div>
      <div class="home-link-wrap" id="homeWrap">
        <button type="button" class="site home-link" id="homeBtn">
          <span class="site-icon" aria-hidden="true">🏠</span>
          <span class="site-text"><span class="site-name">トップ（最近の更新）</span></span>
        </button>
      </div>
      <nav class="site-nav" id="siteNav"></nav>
    </aside>

    <!-- スマホで一覧を開いたときの背景（押すと閉じる） -->
    <div class="overlay" id="overlay"></div>

    <!-- 右：選んだページを表示 -->
    <main class="main">
      <div class="topbar">
        <button type="button" class="icon-btn open-btn" id="openBtn" aria-label="一覧を出す" title="一覧を出す">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="current">
          <span class="current-group" id="currentGroup"></span>
          <span class="current-name" id="currentName"></span>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" id="reloadBtn" aria-label="再読み込み" title="再読み込み" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
          </button>
          <a class="icon-btn" id="newTabBtn" target="_blank" rel="noopener" aria-label="新しいタブで開く" title="新しいタブで開く" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
          </a>
        </div>
      </div>
      <div class="viewer" id="viewerWrap">
        <iframe id="viewer" title="選んだページ"></iframe>
        <p class="empty" id="empty">左の一覧からページを選んでください</p>
        <!-- トップ：view全体の最近の更新（中身は 更新一覧.json から作る） -->
        <section class="top-view" id="topView" hidden>
          <div class="top-inner">
            <p class="top-kicker">CRATER VIEW</p>
            <h1 class="top-title">最近の更新</h1>
            <p class="top-lead" id="topLead"></p>
            <div class="top-list" id="topList"></div>
            <button type="button" class="top-more" id="topMore" hidden></button>
          </div>
        </section>
      </div>
    </main>

  </div>

  <script>
    (function () {
      // ===== パスワード =====
      const パスワード = 'fj';

      // 右側に表示するページが使っている「パスワード入力済み」の記憶キー。
      // 入室時に全部「入力済み」にしておくので、中のページでパスワードを聞かれない。
      // 新しいキー名のページを一覧に入れたら、ここにも足す。
      const ページのパスワード記憶キー = [
        'crater_auth', 'wf_auth', 'cv_auth', 'shisanhozengaku_wf_auth', 'cp_auth',
        'tamatebako_auth', 'unlocked_tamatebako', 'srw_unlocked', 'aid_unlocked',
        'auth_bb', 'unlocked'
      ];

      const lockScreen = document.getElementById('lockScreen');
      const app = document.getElementById('app');
      const passwordInput = document.getElementById('passwordInput');
      const errorMsg = document.getElementById('errorMsg');

      function 入室する() {
        ページのパスワード記憶キー.forEach(function (key) { sessionStorage.setItem(key, '1'); });
        lockScreen.hidden = true;
        app.hidden = false;
        一覧を読み込む();
      }

      function パスワードを確かめる() {
        if (passwordInput.value === パスワード) {
          入室する();
        } else {
          errorMsg.hidden = false;
          passwordInput.value = '';
        }
      }

      document.getElementById('enterBtn').addEventListener('click', パスワードを確かめる);
      passwordInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') パスワードを確かめる();
      });

      // ===== このブラウザに覚えさせる（最後に開いたページ・閉じたグループ・一覧をしまったか） =====
      function 読み出す(key, 初期値) {
        try {
          const 値 = localStorage.getItem(key);
          return 値 === null ? 初期値 : JSON.parse(値);
        } catch (e) {
          return 初期値;
        }
      }

      function 書き込む(key, 値) {
        try { localStorage.setItem(key, JSON.stringify(値)); } catch (e) {}
      }

      // ===== 一覧と表示 =====
      const VIEWのURL = 'https://view.crater.co.jp';
      const nav = document.getElementById('siteNav');
      const viewer = document.getElementById('viewer');
      const viewerWrap = document.getElementById('viewerWrap');
      const empty = document.getElementById('empty');
      const currentGroup = document.getElementById('currentGroup');
      const currentName = document.getElementById('currentName');
      const reloadBtn = document.getElementById('reloadBtn');
      const newTabBtn = document.getElementById('newTabBtn');
      const スマホ幅 = window.matchMedia('(max-width: 768px)');

      const 矢印 = '<svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
      const 外部マーク = '<svg class="ext-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>';

      // viewのページか（＝右側に表示できるか）。view以外は相手側が埋め込みを拒否するので新しいタブで開く
      function viewのページか(url) {
        return url.charAt(0) === '/' || url.indexOf(VIEWのURL) === 0;
      }

      // viewのページは「/〜」の形にそろえる（ローカル確認でも本番でも同じように動くように）
      function そろえる(url) {
        return url.indexOf(VIEWのURL) === 0 ? (url.slice(VIEWのURL.length) || '/') : url;
      }

      // ページ一覧.js は毎回最新を読む（viewはブラウザに10分ほど古いファイルが残るので、URLに時刻を付けて避ける）
      function 一覧を読み込む() {
        const script = document.createElement('script');
        script.src = 'ページ一覧.js?t=' + Date.now();
        script.onload = 一覧を組み立てる;
        script.onerror = function () {
          empty.textContent = '一覧を読み込めませんでした。ページを再読み込みしてください';
        };
        document.body.appendChild(script);
      }

      function 一覧を組み立てる() {
        if (nav.childElementCount) return;

        const 一覧 = Array.isArray(window.ページ一覧) ? window.ページ一覧 : [];
        const 閉じたグループ = new Set(読み出す('view_hub_closed_groups', []));

        一覧.forEach(function (g) {
          const section = document.createElement('section');
          section.className = 'group';
          if (閉じたグループ.has(g.グループ)) section.classList.add('is-closed');

          // グループ名（押すと開閉）
          const head = document.createElement('button');
          head.type = 'button';
          head.className = 'group-head';
          head.setAttribute('aria-expanded', String(!section.classList.contains('is-closed')));
          const groupName = document.createElement('span');
          groupName.textContent = g.グループ;
          head.appendChild(groupName);
          head.insertAdjacentHTML('beforeend', 矢印);
          head.addEventListener('click', function () {
            const 閉じた = section.classList.toggle('is-closed');
            head.setAttribute('aria-expanded', String(!閉じた));
            if (閉じた) 閉じたグループ.add(g.グループ); else 閉じたグループ.delete(g.グループ);
            書き込む('view_hub_closed_groups', Array.from(閉じたグループ));
          });

          // ページ名
          const list = document.createElement('ul');
          list.className = 'group-list';

          (g.ページ || []).forEach(function (p) {
            const url = そろえる(p.URL);
            let item;

            if (viewのページか(p.URL)) {
              item = document.createElement('button');
              item.type = 'button';
              item.addEventListener('click', function () { ページを開く(p.名前, g.グループ, url); });
            } else {
              item = document.createElement('a');
              item.href = url;
              item.target = '_blank';
              item.rel = 'noopener';
              item.title = '新しいタブで開きます';
            }

            item.classList.add('site');
            item.dataset.url = url;
            item.dataset.name = p.名前;
            item.dataset.group = g.グループ;

            // 名前（検索が本文に当たった時は、その下に当たった部分を出す）
            const text = document.createElement('span');
            text.className = 'site-text';
            const name = document.createElement('span');
            name.className = 'site-name';
            name.textContent = p.名前;
            const snippet = document.createElement('span');
            snippet.className = 'site-snippet';
            snippet.hidden = true;
            text.appendChild(name);
            text.appendChild(snippet);

            // 名前の頭の絵文字アイコン（ページ一覧.js の「アイコン」。無い時は📄）
            const icon = document.createElement('span');
            icon.className = 'site-icon';
            icon.setAttribute('aria-hidden', 'true');
            icon.textContent = p.アイコン || '📄';
            item.appendChild(icon);
            item.appendChild(text);
            if (item.tagName === 'A') item.insertAdjacentHTML('beforeend', 外部マーク);

            const li = document.createElement('li');
            li.appendChild(item);
            list.appendChild(li);
          });

          section.appendChild(head);
          section.appendChild(list);
          nav.appendChild(section);
        });

        // 開いたら、まずトップ（view全体の最近の更新）を出す
        トップを開く();
      }

      // ===== 検索（ページ名・グループ名・各ページのタイトル・見出し・本文） =====
      const searchInput = document.getElementById('searchInput');
      const searchStatus = document.getElementById('searchStatus');
      const ページの文字 = {};     // URL → そのページのタイトル・見出し・本文をつなげた文字
      let 読み込み状態 = 'まだ';   // まだ → 読み込み中 → 済み

      // 検索用に、全角・半角、大文字・小文字の違いをそろえる（URLには使わない）
      function 検索用にそろえる(s) {
        return (s || '').normalize('NFKC').toLowerCase();
      }

      // viewのページの中身を読み、タイトル・見出し・本文の文字を取り出す（検索欄を使った時に1回だけ）
      function ページの文字を読み込む() {
        if (読み込み状態 !== 'まだ') return;
        const ボタン = Array.from(nav.querySelectorAll('button.site'));
        if (!ボタン.length) return;
        読み込み状態 = '読み込み中';
        検索する();

        Promise.all(ボタン.map(function (b) {
          return fetch(b.dataset.url)
            .then(function (res) { return res.ok ? res.text() : ''; })
            .then(function (html) {
              const doc = new DOMParser().parseFromString(html, 'text/html');
              doc.querySelectorAll('script, style, noscript, template, svg').forEach(function (el) { el.remove(); });
              const 見出し = Array.from(doc.querySelectorAll('h1, h2, h3, h4')).map(function (h) { return h.textContent; }).join(' ');
              const 本文 = doc.body ? doc.body.textContent : '';
              ページの文字[b.dataset.url] = [doc.title, 見出し, 本文].join(' ').replace(/\s+/g, ' ').trim();
            })
            .catch(function () {});
        })).then(function () {
          読み込み状態 = '済み';
          検索する();
        });
      }

      // 本文で当たった所の前後を少し切り出し、当たった語に印をつける
      function 当たった所を出す(el, 文字, 語) {
        const そろえた文字 = 検索用にそろえる(文字);
        const 位置 = そろえた文字.indexOf(語);
        if (位置 < 0) { el.hidden = true; return; }
        // 全角半角をそろえて文字数が変わった時は、そろえた方の文字で見せる（位置がずれないように）
        const 見せる文字 = そろえた文字.length === 文字.length ? 文字 : そろえた文字;
        const 始め = Math.max(0, 位置 - 16);
        const 終わり = Math.min(見せる文字.length, 位置 + 語.length + 24);

        el.textContent = '';
        el.appendChild(document.createTextNode((始め > 0 ? '…' : '') + 見せる文字.slice(始め, 位置)));
        const mark = document.createElement('mark');
        mark.textContent = 見せる文字.slice(位置, 位置 + 語.length);
        el.appendChild(mark);
        el.appendChild(document.createTextNode(見せる文字.slice(位置 + 語.length, 終わり) + (終わり < 見せる文字.length ? '…' : '')));
        el.hidden = false;
      }

      function 検索する() {
        const 語 = 検索用にそろえる(searchInput.value).trim().split(/\s+/).filter(Boolean);
        const 検索中 = 語.length > 0;
        let 件数 = 0;
        nav.classList.toggle('is-searching', 検索中);
        homeWrap.hidden = 検索中;

        nav.querySelectorAll('.group').forEach(function (section) {
          let 見えている = 0;
          section.querySelectorAll('li').forEach(function (li) {
            const item = li.querySelector('.site');
            const snippet = li.querySelector('.site-snippet');
            const 名前側 = 検索用にそろえる(item.dataset.name + ' ' + item.dataset.group);
            const 中身 = ページの文字[item.dataset.url] || '';
            const 全部 = 名前側 + ' ' + 検索用にそろえる(中身);
            const 当たり = !検索中 || 語.every(function (w) { return 全部.indexOf(w) >= 0; });
            li.hidden = !当たり;

            // 名前では当たらず本文で当たった語があれば、その部分を名前の下に出す
            const 本文だけの語 = 検索中 && 当たり ? 語.find(function (w) { return 名前側.indexOf(w) < 0; }) : null;
            if (本文だけの語) 当たった所を出す(snippet, 中身, 本文だけの語); else snippet.hidden = true;

            if (当たり) 見えている++;
          });
          section.hidden = 見えている === 0;
          件数 += 見えている;
        });

        if (!検索中) {
          searchStatus.hidden = true;
          return;
        }
        searchStatus.hidden = false;
        searchStatus.textContent = (件数 ? 件数 + '件' : '見つかりませんでした') + (読み込み状態 === '読み込み中' ? '（本文を読み込み中…）' : '');
      }

      searchInput.addEventListener('focus', ページの文字を読み込む);
      searchInput.addEventListener('input', function () {
        ページの文字を読み込む();
        検索する();
      });
      searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          searchInput.value = '';
          検索する();
        }
      });

      // ===== トップ（view全体の最近の更新） =====
      // 一覧は GitHub Actions（VIEW更新一覧）が view-data ブランチに置く 更新一覧.json を読む
      const 更新一覧のURL = 'https://raw.githubusercontent.com/crater-inc/crater/view-data/' + encodeURIComponent('更新一覧.json');
      const topView = document.getElementById('topView');
      const topList = document.getElementById('topList');
      const topLead = document.getElementById('topLead');
      const topMore = document.getElementById('topMore');
      const homeBtn = document.getElementById('homeBtn');
      const homeWrap = document.getElementById('homeWrap');
      let 更新一覧 = null;
      let 全部見せる = false;

      function トップを開く() {
        topView.hidden = false;
        viewer.hidden = true;
        empty.hidden = true;
        viewerWrap.classList.remove('is-loading');
        currentGroup.textContent = '';
        currentName.textContent = 'トップ（最近の更新）';
        newTabBtn.hidden = true;
        reloadBtn.hidden = false;
        document.title = 'VIEW管理';
        homeBtn.classList.add('is-active');
        nav.querySelectorAll('.site').forEach(function (s) {
          s.classList.remove('is-active');
          s.removeAttribute('aria-current');
        });
        if (スマホ幅.matches) 一覧を引き出す(false);
        更新一覧を読み込む();
      }

      function 更新一覧を読み込む() {
        topLead.textContent = '読み込み中…';
        topList.textContent = '';
        topMore.hidden = true;
        fetch(更新一覧のURL + '?t=' + Date.now(), { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error(res.status);
            return res.json();
          })
          .then(function (data) {
            更新一覧 = data;
            全部見せる = false;
            更新一覧を描く();
          })
          .catch(function () {
            topLead.textContent = '更新一覧を準備中です。数分たってから、右上の再読み込みを押してください。';
          });
      }

      // 「今日」「昨日」「9月9日（水）」の見出し
      function 日付の見出し(日時) {
        const 今日 = new Date();
        今日.setHours(0, 0, 0, 0);
        const その日 = new Date(日時);
        その日.setHours(0, 0, 0, 0);
        const 何日前 = Math.round((今日 - その日) / 86400000);
        if (何日前 === 0) return '今日';
        if (何日前 === 1) return '昨日';
        return (日時.getMonth() + 1) + '月' + 日時.getDate() + '日（' + '日月火水木金土'.charAt(日時.getDay()) + '）';
      }

      function 更新一覧を描く() {
        const ページ = (更新一覧 && 更新一覧.ページ) || [];
        const 二週間前 = Date.now() - 14 * 86400000;
        const 最近 = ページ.filter(function (p) { return new Date(p.日時).getTime() >= 二週間前; });
        const 見せる = 全部見せる ? ページ : (最近.length ? 最近 : ページ.slice(0, 20));

        topLead.textContent = 全部見せる
          ? 'view の全ページ（' + ページ.length + '件）を、更新が新しい順に並べています。'
          : 'view の全ページのうち、直近2週間に更新されたページです（' + 見せる.length + '件）。押すとここで開きます。';
        topList.textContent = '';

        let 今の見出し = '';
        let 日の箱 = null;
        let 前の行 = null;
        見せる.forEach(function (p) {
          // 同じ変更でまとめて更新されたページは1行にまとめる（「ほか7ページ」）
          const まとめキー = p.日時 + '|' + p.案件 + '|' + p.内容;
          if (前の行 && 前の行.dataset.key === まとめキー) {
            前の行.dataset.count = Number(前の行.dataset.count) + 1;
            前の行.querySelector('.top-others').textContent = 'ほか' + (前の行.dataset.count - 1) + 'ページ';
            return;
          }

          const 日時 = new Date(p.日時);
          const 見出し = 日付の見出し(日時);
          if (見出し !== 今の見出し) {
            今の見出し = 見出し;
            日の箱 = document.createElement('section');
            日の箱.className = 'top-day';
            const h = document.createElement('h2');
            h.className = 'top-day-label';
            h.textContent = 見出し;
            日の箱.appendChild(h);
            topList.appendChild(日の箱);
          }

          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'top-row';
          row.dataset.key = まとめキー;
          row.dataset.count = 1;

          const time = document.createElement('span');
          time.className = 'top-time';
          time.textContent = ('0' + 日時.getHours()).slice(-2) + ':' + ('0' + 日時.getMinutes()).slice(-2);

          const main = document.createElement('span');
          main.className = 'top-main';
          const nameRow = document.createElement('span');
          nameRow.className = 'top-name-row';
          const name = document.createElement('span');
          name.className = 'top-name';
          name.textContent = p.タイトル;
          const project = document.createElement('span');
          project.className = 'top-project';
          project.textContent = p.案件;
          const others = document.createElement('span');
          others.className = 'top-others';
          nameRow.appendChild(name);
          nameRow.appendChild(project);
          nameRow.appendChild(others);
          const note = document.createElement('span');
          note.className = 'top-note';
          note.textContent = p.内容;
          main.appendChild(nameRow);
          main.appendChild(note);

          row.appendChild(time);
          row.appendChild(main);
          row.addEventListener('click', function () { ページを開く(p.タイトル, p.案件, p.URL); });
          日の箱.appendChild(row);
          前の行 = row;
        });

        topMore.textContent = 'それより前も見る（全' + ページ.length + '件）';
        topMore.hidden = 全部見せる || ページ.length <= 見せる.length;
      }

      topMore.addEventListener('click', function () {
        全部見せる = true;
        更新一覧を描く();
      });
      homeBtn.addEventListener('click', トップを開く);

      function ページを開く(名前, グループ名, url) {
        topView.hidden = true;
        viewer.hidden = false;
        homeBtn.classList.remove('is-active');
        viewerWrap.classList.add('is-loading');
        viewer.src = url;
        viewer.title = 名前;
        empty.hidden = true;

        currentGroup.textContent = グループ名;
        currentName.textContent = 名前;
        newTabBtn.href = url;
        newTabBtn.hidden = false;
        reloadBtn.hidden = false;
        document.title = 'VIEW管理 | ' + 名前;

        nav.querySelectorAll('.site').forEach(function (s) {
          const 選択中 = s.dataset.url === url;
          s.classList.toggle('is-active', 選択中);
          if (選択中) s.setAttribute('aria-current', 'page'); else s.removeAttribute('aria-current');
        });

        if (スマホ幅.matches) 一覧を引き出す(false);
      }

      viewer.addEventListener('load', function () {
        viewerWrap.classList.remove('is-loading');
        // 中でリンクを移動した時も「新しいタブで開く」が今見ているページを開くように
        try {
          const 今のURL = viewer.contentWindow.location.href;
          if (今のURL && 今のURL !== 'about:blank') newTabBtn.href = 今のURL;
        } catch (e) {}
      });

      reloadBtn.addEventListener('click', function () {
        // トップを見ている時は、更新一覧を読み直す
        if (!topView.hidden) {
          更新一覧を読み込む();
          return;
        }
        viewerWrap.classList.add('is-loading');
        try {
          viewer.contentWindow.location.reload();
        } catch (e) {
          viewer.src = viewer.src;
        }
      });

      // ===== 一覧の出し入れ（PC＝しまう／出す、スマホ＝左から引き出す） =====
      function 一覧を引き出す(出す) {
        app.classList.toggle('is-drawer-open', 出す);
      }

      if (読み出す('view_hub_collapsed', false)) app.classList.add('is-collapsed');

      document.getElementById('closeBtn').addEventListener('click', function () {
        if (スマホ幅.matches) {
          一覧を引き出す(false);
        } else {
          app.classList.add('is-collapsed');
          書き込む('view_hub_collapsed', true);
        }
      });

      document.getElementById('openBtn').addEventListener('click', function () {
        if (スマホ幅.matches) {
          一覧を引き出す(true);
        } else {
          app.classList.remove('is-collapsed');
          書き込む('view_hub_collapsed', false);
        }
      });

      document.getElementById('overlay').addEventListener('click', function () { 一覧を引き出す(false); });

      // 入室済みならパスワード画面を飛ばす
      if (sessionStorage.getItem('crater_auth') === '1') 入室する();
    })();
  </script>

</body>
