<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRATER スライドテンプレート</title>
  <link rel="stylesheet" href="https://use.typekit.net/qwe2tdt.css">
  <style>
    /* ==================================================
       CRATER Design System
       フォント: a1-gothic（日本語）/ urw-din（英数字）
       背景: #C8C8C8 / テキスト: #111111
    ================================================== */
    :root {
      --c-base:   #C8C8C8;
      --c-black:  #111111;
      --c-text:   #111111;
      --c-sub:    #555555;
      --c-white:  #FFFFFF;
      --c-border: rgba(0,0,0,0.12);
      --font-en:  'urw-din', 'a1-gothic', sans-serif;
      --font-ja:  'a1-gothic', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; overflow: hidden; }
    :lang(ja) { line-break: strict; }
    h1, h2, h3 { word-break: normal; overflow-wrap: normal; text-wrap: balance; }
    p, li { word-break: normal; overflow-wrap: normal; text-wrap: pretty; }

    /* ステージ */
    .slide-stage {
      width: 100vw; height: 100vh;
      background: var(--c-base);
      overflow: hidden; position: relative;
    }

    /* 1920×1080 固定キャンバス */
    .slide {
      width: 1920px; height: 1080px;
      position: absolute; top: 50%; left: 50%;
      overflow: hidden;
      background: var(--c-base);
      container-type: inline-size;
      display: none;
      transform-origin: center center;
    }
    .slide.active { display: flex; flex-direction: column; }

    /* 黒バッジ */
    .badge {
      display: inline-block;
      background: var(--c-black); color: var(--c-white);
      font-family: var(--font-en);
      font-size: 0.9cqw; font-weight: 700;
      letter-spacing: 0.12em;
      padding: 0.35cqw 0.9cqw;
      border-radius: 0;
    }

    /* UI オーバーレイ */
    .nav-prev, .nav-next {
      position: fixed; top: 0; width: 50%; height: 100%;
      z-index: 100; cursor: pointer;
    }
    .nav-prev { left: 0; }
    .nav-next { right: 0; }

    .status-bar {
      position: fixed; top: 18px; right: 64px;
      font-family: var(--font-en); font-size: 11px;
      letter-spacing: 0.12em; color: rgba(0,0,0,0.28);
      z-index: 200; pointer-events: none;
    }
    .menu-btn {
      position: fixed; top: 13px; right: 18px;
      width: 36px; height: 36px; z-index: 300;
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
    }
    .menu-btn span {
      display: block; width: 18px; height: 1px;
      background: var(--c-black);
    }
    .progress-bar {
      position: fixed; bottom: 0; left: 0;
      height: 2px; background: var(--c-black);
      transition: width 0.3s ease; z-index: 200;
    }

    /* サイドバー */
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 400; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
    .sidebar {
      position: absolute; top: 0; right: -300px; bottom: 0;
      width: 280px; background: var(--c-black); color: var(--c-white);
      transition: right 0.3s ease; display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar-overlay.open .sidebar { right: 0; }
    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-logo {
      font-family: var(--font-en); font-size: 14px;
      font-weight: 600; letter-spacing: 0.15em;
    }
    .sidebar-close {
      background: none; border: none; color: rgba(255,255,255,0.3);
      font-size: 13px; cursor: pointer;
    }
    .sidebar-list { padding: 8px 0; flex: 1; }
    .sidebar-item {
      display: flex; align-items: center; gap: 14px;
      width: 100%; padding: 11px 24px;
      background: none; border: none; cursor: pointer;
      font-family: var(--font-ja); font-size: 11px; font-weight: 700;
      letter-spacing: 0.06em; color: rgba(255,255,255,0.35);
      text-align: left; transition: color 0.15s;
    }
    .sidebar-item:hover { color: rgba(255,255,255,0.7); }
    .sidebar-item.active { color: rgba(255,255,255,0.9); }
    .sidebar-num { font-family: var(--font-en); font-size: 10px; opacity: 0.25; min-width: 20px; }

    /* ページネーション */
    .pagination {
      position: fixed; bottom: 18px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center;
      z-index: 200; pointer-events: auto;
    }
    .pagination-item {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 14px;
      background: none; border: none; cursor: pointer;
      font-family: var(--font-ja); font-size: 10px;
      letter-spacing: 0.06em; color: rgba(0,0,0,0.22);
      transition: color 0.15s; position: relative;
    }
    .pagination-item::after {
      content: ''; position: absolute; right: 0; top: 50%;
      transform: translateY(-50%); width: 1px; height: 9px;
      background: rgba(0,0,0,0.12);
    }
    .pagination-item:last-child::after { display: none; }
    .pagination-item:hover { color: rgba(0,0,0,0.45); }
    .pagination-item.active { color: var(--c-text); font-weight: 700; }
    .pagination-num { font-family: var(--font-en); font-size: 9px; opacity: 0.35; }

    /* トークスクリプト */
    .script-trigger { position: fixed; bottom: 0; left: 0; right: 0; height: 48px; z-index: 150; }
    .script-panel {
      position: fixed; bottom: -100%; left: 0; right: 0;
      max-height: 28vh; background: rgba(17,17,17,0.94);
      color: rgba(255,255,255,0.82); padding: 20px 48px;
      font-family: var(--font-ja); font-size: 13px; line-height: 1.95;
      letter-spacing: 0.025em; overflow-y: auto;
      z-index: 160; transition: bottom 0.22s ease;
    }
    .script-panel.visible { bottom: 0; }


    /* ==================================================
       TYPE 01: 表紙（COVER）
       グレー背景 / 左下ロゴ / タイトル縦中央
    ================================================== */
    .s-cover {
      height: 100%; padding: 5cqw;
      display: flex; flex-direction: column;
      justify-content: space-between;
    }
    .s-cover-body {
      display: flex; flex-direction: column; gap: 1.4cqw;
      margin-top: auto; margin-bottom: auto;
    }
    .s-cover-client {
      font-family: var(--font-ja); font-size: 1.4cqw;
      font-weight: 400; color: var(--c-sub); letter-spacing: 0.04em;
    }
    .s-cover-title {
      font-family: var(--font-ja); font-size: 6cqw;
      font-weight: 900; line-height: 1.1; letter-spacing: 0.04em;
      color: var(--c-text);
    }
    .s-cover-body .badge { align-self: flex-start; margin-top: 0.6cqw; }
    .s-cover-footer {
      display: flex; flex-direction: column;
      align-items: flex-start; gap: 0.8cqw;
    }
    .s-cover-logo { width: 8cqw; height: auto; display: block; }
    .s-cover-copy {
      font-family: var(--font-en); font-size: 0.75cqw;
      letter-spacing: 0.1em; color: var(--c-sub);
    }


    /* ==================================================
       TYPE 02: ステートメント（STATEMENT）
       グレー背景 / 左上バッジ / 大見出し縦中央
    ================================================== */
    .s-stmt {
      height: 100%; padding: 5cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-stmt-top { flex-shrink: 0; }
    .s-stmt-main {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 2.8cqw;
    }
    .s-stmt-heading {
      font-family: var(--font-ja); font-size: 4.8cqw;
      font-weight: 900; line-height: 1.4; letter-spacing: 0.04em;
    }
    .s-stmt-body {
      font-family: var(--font-ja); font-size: 1.45cqw;
      font-weight: 400; line-height: 1.95; color: var(--c-sub);
      max-width: 56cqw;
    }
    .s-stmt-copy {
      position: absolute; right: 5cqw; bottom: 5cqw;
      font-family: var(--font-en); font-size: 0.75cqw;
      letter-spacing: 0.1em; color: var(--c-sub);
    }


    /* ==================================================
       TYPE 03: NUMBER（インパクト数字）
       黒背景 / 白数字 / 横グリッド
    ================================================== */
    .s-number {
      height: 100%; padding: 5cqw;
      display: flex; flex-direction: column;
      background: var(--c-black); position: relative;
    }
    .s-number-top { flex-shrink: 0; }
    .s-number-grid {
      flex: 1; display: flex; align-items: center;
      gap: 0;
    }
    .s-number-item {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 1.2cqw;
      padding: 0 3.5cqw;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .s-number-item:first-child { padding-left: 0; }
    .s-number-item:last-child { border-right: none; }
    .s-number-num-row { display: flex; align-items: baseline; gap: 0.4cqw; }
    .s-number-num {
      font-family: var(--font-en); font-size: 9cqw;
      font-weight: 600; line-height: 1; letter-spacing: -0.05em;
      color: var(--c-white);
    }
    .s-number-unit {
      font-family: var(--font-ja); font-size: 2.4cqw;
      font-weight: 700; color: rgba(255,255,255,0.45);
    }
    .s-number-label {
      font-family: var(--font-en); font-size: 0.85cqw;
      letter-spacing: 0.18em; color: rgba(255,255,255,0.3);
    }
    .s-number-desc {
      font-family: var(--font-ja); font-size: 1.1cqw;
      font-weight: 400; line-height: 1.8; color: rgba(255,255,255,0.4);
    }
    .s-number-copy {
      position: absolute; right: 5cqw; bottom: 5cqw;
      font-family: var(--font-en); font-size: 0.75cqw;
      letter-spacing: 0.1em; color: rgba(255,255,255,0.18);
    }


    /* ==================================================
       TYPE 04: サービスリスト（SERVICE）
       グレー背景 / 見出し左 / リスト右 or 縦
    ================================================== */
    .s-service {
      height: 100%; padding: 5cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-service-top { flex-shrink: 0; }
    .s-service-main {
      flex: 1; display: flex; align-items: center; gap: 6cqw;
    }
    .s-service-left { flex: 0 0 28cqw; }
    .s-service-heading {
      font-family: var(--font-ja); font-size: 3cqw;
      font-weight: 900; line-height: 1.45; letter-spacing: 0.04em;
    }
    .s-service-right { flex: 1; }
    .s-service-list { list-style: none; }
    .s-service-item {
      display: grid; grid-template-columns: 3.5cqw 14cqw 1fr;
      align-items: baseline; gap: 1.2cqw;
      padding: 1.1cqw 0;
      border-bottom: 1px solid var(--c-border);
    }
    .s-service-item:first-child { border-top: 1px solid var(--c-border); }
    .s-service-num {
      font-family: var(--font-en); font-size: 0.8cqw;
      color: var(--c-sub); letter-spacing: 0.05em;
    }
    .s-service-name {
      font-family: var(--font-ja); font-size: 1.2cqw; font-weight: 700;
    }
    .s-service-desc {
      font-family: var(--font-ja); font-size: 1.05cqw;
      color: var(--c-sub); line-height: 1.7;
    }
    .s-service-copy {
      position: absolute; right: 5cqw; bottom: 5cqw;
      font-family: var(--font-en); font-size: 0.75cqw;
      letter-spacing: 0.1em; color: var(--c-sub);
    }


    /* ==================================================
       TYPE 05: データ実績（RESULT）
       グレー背景 / 大%数字 / 2行
    ================================================== */
    .s-result {
      height: 100%; padding: 5cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-result-top { flex-shrink: 0; }
    .s-result-main {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
    }
    .s-result-item {
      display: grid; grid-template-columns: 2.5cqw 13cqw 1fr;
      align-items: center; gap: 3cqw;
      padding: 3cqw 0;
    }
    .s-result-divider { width: 100%; height: 1px; background: var(--c-border); }
    .s-result-label-col {
      display: flex; align-items: center; justify-content: center;
    }
    .s-result-label {
      font-family: var(--font-ja); font-size: 0.9cqw;
      color: var(--c-sub); letter-spacing: 0.2em;
      writing-mode: vertical-rl; text-orientation: mixed;
    }
    .s-result-num-row { display: flex; align-items: baseline; gap: 0.2cqw; }
    .s-result-num {
      font-family: var(--font-en); font-size: 9cqw;
      font-weight: 600; line-height: 1; letter-spacing: -0.04em;
    }
    .s-result-unit {
      font-family: var(--font-en); font-size: 3.5cqw;
      font-weight: 400; letter-spacing: -0.02em;
    }
    .s-result-text { display: flex; flex-direction: column; gap: 0.8cqw; }
    .s-result-desc {
      font-family: var(--font-ja); font-size: 1.3cqw;
      font-weight: 400; line-height: 1.85;
    }
    .s-result-note {
      font-family: var(--font-ja); font-size: 0.82cqw;
      color: var(--c-sub); line-height: 1.6;
    }
    .s-result-copy {
      position: absolute; right: 5cqw; bottom: 5cqw;
      font-family: var(--font-en); font-size: 0.75cqw;
      letter-spacing: 0.1em; color: var(--c-sub);
    }


    /* ==================================================
       TYPE 06: スプリット（SPLIT）
       左テキスト60% / 右写真フルブリード40%
    ================================================== */
    .s-split {
      height: 100%; display: flex; flex-direction: row;
      overflow: hidden; position: relative;
    }
    .s-split-left {
      width: 60%; display: flex; flex-direction: column; padding: 5cqw;
    }
    .s-split-left-top { flex-shrink: 0; }
    .s-split-left-main {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 2.4cqw;
    }
    .s-split-heading {
      font-family: var(--font-ja); font-size: 3.2cqw;
      font-weight: 900; line-height: 1.4; letter-spacing: 0.04em;
    }
    .s-split-body {
      font-family: var(--font-ja); font-size: 1.25cqw;
      font-weight: 400; line-height: 1.95; color: var(--c-sub);
      max-width: 42cqw;
    }
    .s-split-copy {
      position: absolute; left: 5cqw; bottom: 5cqw;
      font-family: var(--font-en); font-size: 0.75cqw;
      letter-spacing: 0.1em; color: var(--c-sub);
    }
    .s-split-right {
      width: 40%; height: 100%; flex-shrink: 0; overflow: hidden;
      background: #999;
    }
    .s-split-right img { width: 100%; height: 100%; object-fit: cover; }
    .s-split-photo-fill {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #888;
      font-family: var(--font-en); font-size: 1cqw;
      letter-spacing: 0.3em; color: rgba(255,255,255,0.2);
    }


    /* ==================================================
       TYPE 07: 会社概要テーブル（OVERVIEW）
       グレー背景 / 大ロゴ / 水平罫線テーブル
    ================================================== */
    .s-overview {
      height: 100%; padding: 5cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-overview-top { flex-shrink: 0; }
    .s-overview-main {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 1.8cqw;
    }
    .s-overview-logo { width: 14cqw; height: auto; display: block; }
    .s-overview-table { width: 100%; border-collapse: collapse; }
    .s-overview-table tr { border-bottom: 1px solid var(--c-border); }
    .s-overview-table tr:last-child { border-bottom: none; }
    .s-overview-table th {
      text-align: left; width: 12cqw; padding: 0.9cqw 0;
      font-family: var(--font-ja); font-size: 1cqw;
      font-weight: 400; color: var(--c-sub); vertical-align: middle;
    }
    .s-overview-table td {
      padding: 0.9cqw 0 0.9cqw 2cqw;
      font-family: var(--font-ja); font-size: 1.2cqw;
      font-weight: 400; color: var(--c-text); line-height: 1.6;
    }
    .s-overview-copy {
      position: absolute; right: 5cqw; bottom: 5cqw;
      font-family: var(--font-en); font-size: 0.75cqw;
      letter-spacing: 0.1em; color: var(--c-sub);
    }

  </style>
</head>
<body>

<div class="slide-stage" id="slide-stage"></div>
<div class="nav-prev" id="nav-prev"></div>
<div class="nav-next" id="nav-next"></div>
<div class="status-bar" id="status-bar"></div>
<button class="menu-btn" id="menu-btn"><span></span><span></span><span></span></button>
<div class="progress-bar" id="progress-bar" style="width:0"></div>

<div class="sidebar-overlay" id="sidebar-overlay">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">CRATER</span>
      <button class="sidebar-close" id="sidebar-close">✕</button>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
  </nav>
</div>

<nav class="pagination" id="pagination"></nav>
<div class="script-trigger" id="script-trigger"></div>
<div class="script-panel" id="script-panel"></div>

<script>
// ============================================================
// slides.js — 1スライド1関数
// ============================================================

function slide01Cover() {
  return `<section class="slide" data-section="cover" data-notes="本日はお時間をいただきありがとうございます。株式会社クレーターの会社概要をご覧ください。クレーターは「この星に、つめあとを残せ」をブランドコンセプトに、デザインの力でブランドの価値を伝えることを使命としています。">
  <div class="s-cover">
    <div class="s-cover-body">
      <p class="s-cover-client">○○株式会社 御中</p>
      <h1 class="s-cover-title">会社概要</h1>
      <span class="badge">2025</span>
    </div>
    <div class="s-cover-footer">
      <img class="s-cover-logo" src="assets/logo.svg" alt="CRATER">
      <p class="s-cover-copy">©CRATER Inc.</p>
    </div>
  </div>
</section>`;
}

function slide02Concept() {
  return `<section class="slide" data-section="concept" data-notes="クレーターとは、隕石が地面に衝突した跡。何かに全力でぶつかった証です。私たちは、デザインの力であなたのブランドを世界に刻みます。">
  <div class="s-stmt">
    <div class="s-stmt-top"><span class="badge">CONCEPT</span></div>
    <div class="s-stmt-main">
      <h2 class="s-stmt-heading">この星に、<br>つめあとを残せ。</h2>
      <p class="s-stmt-body">
        クレーターとは、隕石が地面に衝突した跡。<br>
        何かに全力でぶつかった証です。<br>
        私たちは、デザインの力で<br>
        あなたのブランドを世界に刻みます。
      </p>
    </div>
    <p class="s-stmt-copy">©CRATER Inc.</p>
  </div>
</section>`;
}

function slide03Mission() {
  return `<section class="slide" data-section="mission" data-notes="クレーターのミッションはシンプルです。価値あるブランドを、必要な人に届ける。メッセージとストーリーを視覚化し、ブランドの価値を正確に伝えることが私たちの仕事です。">
  <div class="s-stmt">
    <div class="s-stmt-top"><span class="badge">MISSION</span></div>
    <div class="s-stmt-main">
      <h2 class="s-stmt-heading">価値あるブランドを、<br>必要な人に届ける。</h2>
      <p class="s-stmt-body">
        メッセージとストーリーを視覚化し、<br>
        ブランドの価値を正確に伝えることが、<br>
        クレーターの仕事です。
      </p>
    </div>
    <p class="s-stmt-copy">©CRATER Inc.</p>
  </div>
</section>`;
}

function slide04Number() {
  return `<section class="slide" data-section="number" data-notes="3つの数字でクレーターの実績をお伝えします。創業12年、リピート率85%、200社以上の制作実績。この数字が私たちの信頼を語っています。">
  <div class="s-number">
    <div class="s-number-top">
      <span class="badge" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.3);">NUMBER</span>
    </div>
    <div class="s-number-grid">
      <div class="s-number-item">
        <p class="s-number-label">SINCE</p>
        <div class="s-number-num-row">
          <span class="s-number-num">12</span>
          <span class="s-number-unit">年</span>
        </div>
        <p class="s-number-desc">2013年の創業から<br>変わらず設計し続けています。</p>
      </div>
      <div class="s-number-item">
        <p class="s-number-label">REPEAT RATE</p>
        <div class="s-number-num-row">
          <span class="s-number-num">85</span>
          <span class="s-number-unit">%</span>
        </div>
        <p class="s-number-desc">クライアントの想いを丁寧に汲み取り、<br>継続的な信頼を得ています。</p>
      </div>
      <div class="s-number-item">

window.slideFactories = [
  slide01Cover, slide02Concept, slide03Mission,
  slide04Number, slide05Service, slide06Split, slide07Overview
];
window.agendaItems = [
  { id: 'cover',    label: '表紙' },
  { id: 'concept',  label: 'コンセプト' },
  { id: 'mission',  label: 'ミッション' },
  { id: 'number',   label: 'NUMBER' },
  { id: 'service',  label: 'サービス' },
  { id: 'works',    label: '実績' },
  { id: 'overview', label: '会社概要' },
];
</script>

<script>
// ============================================================
// app.js
// ============================================================
(function () {
  var stage       = document.getElementById('slide-stage');
  var statusBar   = document.getElementById('status-bar');
  var menuBtn     = document.getElementById('menu-btn');
  var overlay     = document.getElementById('sidebar-overlay');
  var sideClose   = document.getElementById('sidebar-close');
  var sideList    = document.getElementById('sidebar-list');
  var progress    = document.getElementById('progress-bar');
  var navPrev     = document.getElementById('nav-prev');
  var navNext     = document.getElementById('nav-next');
  var scriptTrig  = document.getElementById('script-trigger');
  var scriptPanel = document.getElementById('script-panel');
  var pagination  = document.getElementById('pagination');

  var current = 0;
  var total   = slideFactories.length;
  var rendered = {};
  var currentScale = 1;

  function scaleSlides() {
    currentScale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.querySelectorAll('.slide').forEach(function (s) {
      s.style.transform = 'translate(-50%, -50%) scale(' + currentScale + ')';
    });
  }
  window.addEventListener('resize', scaleSlides);

  function ensureRendered(i) {
    if (rendered[i] || i < 0 || i >= total) return;
    var frag = document.createRange().createContextualFragment(slideFactories[i]());
    stage.appendChild(frag);
    rendered[i] = true;
    scaleSlides();
  }

  function goTo(i, skipHash) {
    if (i < 0 || i >= total) return;
    [i - 1, i, i + 1].forEach(function (j) { ensureRendered(j); });
    var slides = stage.querySelectorAll('.slide');
    slides.forEach(function (s) { s.classList.remove('active'); });
    if (slides[i]) slides[i].classList.add('active');
    current = i;
    if (!skipHash) history.replaceState(null, '', '#' + (i + 1));
    statusBar.textContent = agendaItems[i].label + '  ' + (i + 1) + ' / ' + total;
    progress.style.width = ((i + 1) / total * 100) + '%';
    document.querySelectorAll('.sidebar-item').forEach(function (el, idx) {
      el.classList.toggle('active', idx === i);
    });
    document.querySelectorAll('.pagination-item').forEach(function (el, idx) {
      el.classList.toggle('active', idx === i);
    });
    var slide = slides[i];
    scriptPanel.textContent = slide ? (slide.getAttribute('data-notes') || '') : '';
    scriptPanel.classList.remove('visible');
  }

  var initPage = 0;
  var hash = window.location.hash.replace('#', '');
  if (hash && !isNaN(hash)) {
    var p = parseInt(hash, 10) - 1;
    if (p >= 0 && p < total) initPage = p;
  }
  scaleSlides();
  [0, 1, 2].forEach(function (i) { ensureRendered(i); });
  goTo(initPage, true);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ')        { e.preventDefault(); goTo(current + 1); }
    if (e.key === 'ArrowLeft'  || e.key === 'Backspace') { e.preventDefault(); goTo(current - 1); }
    if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    if (e.key === 'End')  { e.preventDefault(); goTo(total - 1); }
    if (e.key === 'Escape') { overlay.classList.remove('open'); }
  });

  navPrev.addEventListener('click', function () { goTo(current - 1); });
  navNext.addEventListener('click', function () { goTo(current + 1); });

  menuBtn.addEventListener('click', function () {
    overlay.classList.toggle('open');
  });
  sideClose.addEventListener('click', function () { overlay.classList.remove('open'); });
  overlay.addEventListener('click', function (e) {
    if (!e.target.closest('.sidebar')) overlay.classList.remove('open');
  });

  agendaItems.forEach(function (item, i) {
    var btn = document.createElement('button');
    btn.className = 'sidebar-item';
    btn.innerHTML =
      '<span class="sidebar-num">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span>' + item.label + '</span>';
    btn.addEventListener('click', function (e) {
      e.stopPropagation(); goTo(i); overlay.classList.remove('open');
    });
    sideList.appendChild(btn);

    var pBtn = document.createElement('button');
    pBtn.className = 'pagination-item';
    pBtn.innerHTML =
      '<span class="pagination-num">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span>' + item.label + '</span>';
    pBtn.addEventListener('click', function (e) { e.stopPropagation(); goTo(i); });
    pagination.appendChild(pBtn);
  });

  var stTimeout = null;
  scriptTrig.addEventListener('mouseenter', function () {
    if (scriptPanel.textContent.trim()) {
      clearTimeout(stTimeout); scriptPanel.classList.add('visible');
    }
  });
  scriptTrig.addEventListener('mouseleave', function () {
    stTimeout = setTimeout(function () { scriptPanel.classList.remove('visible'); }, 300);
  });
  scriptPanel.addEventListener('mouseenter', function () { clearTimeout(stTimeout); });
  scriptPanel.addEventListener('mouseleave', function () {
    stTimeout = setTimeout(function () { scriptPanel.classList.remove('visible'); }, 300);
  });
})();
</script>

</body>
</html>
