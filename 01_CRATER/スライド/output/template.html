<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRATER スライドテンプレート</title>
  <link rel="stylesheet" href="https://use.typekit.net/qwe2tdt.css">
  <script>
    (function(d) {
      var config = { kitId: 'qwe2tdt', scriptTimeout: 3000, async: true },
      h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s);
    })(document);
  </script>
  <style>
    :root {
      --c-base:   #C8C8C8;
      --c-black:  #000000;
      --c-text:   #000000;
      --c-sub:    #000000;
      --c-light:  #B0B0B0;
      --c-border: rgba(0,0,0,0.15);
      --font-en:  'urw-din', 'a1-gothic', sans-serif;
      --font-ja:  'a1-gothic', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #c0c0c0; overflow: hidden; }
    :lang(ja) { line-break: strict; }
    h1,h2,h3 { word-break: normal; overflow-wrap: normal; text-wrap: balance; }
    p, li { word-break: normal; overflow-wrap: normal; text-wrap: pretty; }

    /* ステージ */
    .slide-stage {
      width: 100vw; height: 100vh;
      background: #c0c0c0;
      overflow: hidden; position: relative;
    }

    /* 1920×1080 固定キャンバス */
    .slide {
      width: 1920px; height: 1080px;
      position: absolute; top: 50%; left: 50%;
      overflow: hidden;
      background: var(--c-base);
      container-type: inline-size;
      display: none;
      transform-origin: center center;
    }
    .slide.active { display: flex; flex-direction: column; }

    /* 黒バッジ（左上固定） */
    .badge {
      display: inline-block;
      background: var(--c-black); color: #fff;
      font-family: var(--font-en);
      font-size: 0.85cqw; font-weight: 500;
      letter-spacing: 0.14em;
      padding: 0.32cqw 0.85cqw;
      border-radius: 0;
    }

    /* ページ番号（右下丸） */
    .pg-num {
      position: absolute; right: 4cqw; bottom: 3.5cqw;
      width: 2.4cqw; height: 2.4cqw;
      background: var(--c-black); color: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-en); font-size: 0.8cqw; font-weight: 500;
      letter-spacing: 0.05em;
    }

    /* ロゴフッター（左下） */
    .logo-footer {
      position: absolute; left: 4cqw; bottom: 3.5cqw;
      display: flex; align-items: center; gap: 1cqw;
    }
    .logo-footer img { height: 1.2cqw; width: auto; }
    .logo-footer-text {
      font-family: var(--font-en); font-size: 1.0cqw;
      font-weight: 500; letter-spacing: 0.12em; color: var(--c-black);
    }
    .logo-footer-copy {
      font-family: var(--font-en); font-size: 0.72cqw;
      letter-spacing: 0.08em; color: var(--c-sub);
    }

    /* UI オーバーレイ */
    .nav-prev, .nav-next {
      position: fixed; top: 0; width: 50%; height: 100%;
      z-index: 100; cursor: pointer;
    }
    .nav-prev { left: 0; } .nav-next { right: 0; }

    .status-bar {
      position: fixed; top: 18px; right: 64px;
      font-family: var(--font-en); font-size: 11px;
      letter-spacing: 0.12em; color: rgba(0,0,0,0.3);
      z-index: 200; pointer-events: none;
    }
    .menu-btn {
      position: fixed; bottom: 18px; right: 18px;
      width: 36px; height: 36px; z-index: 300;
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
    }
    .menu-btn span { display: block; width: 18px; height: 1px; background: #111; }
    .progress-bar {
      position: fixed; bottom: 0; left: 0;
      height: 2px; background: #111;
      transition: width 0.3s ease; z-index: 200;
    }

    /* サイドバー */
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 400; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
    .sidebar {
      position: absolute; top: 0; right: -300px; bottom: 0;
      width: 280px; background: #111; color: #fff;
      transition: right 0.3s ease; display: flex; flex-direction: column;
    }
    .sidebar-overlay.open .sidebar { right: 0; }
    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-logo { font-family: var(--font-en); font-size: 13px; font-weight: 500; letter-spacing: 0.15em; }
    .sidebar-close { background: none; border: none; color: rgba(255,255,255,0.3); font-size: 13px; cursor: pointer; }
    .sidebar-list { padding: 8px 0; flex: 1; overflow-y: auto; }
    .sidebar-item {
      display: flex; align-items: center; gap: 14px;
      width: 100%; padding: 11px 24px;
      background: none; border: none; cursor: pointer;
      font-family: var(--font-ja); font-size: 11px; font-weight: 700;
      letter-spacing: 0.06em; color: rgba(255,255,255,0.35);
      text-align: left; transition: color 0.15s;
    }
    .sidebar-item:hover { color: rgba(255,255,255,0.7); }
    .sidebar-item.active { color: #fff; }
    .sidebar-num { font-family: var(--font-en); font-size: 10px; opacity: 0.25; min-width: 20px; }

    /* ページネーション */
    .pagination {
      display: none;
    }
    .pagination-item {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 14px; background: none; border: none; cursor: pointer;
      font-family: var(--font-ja); font-size: 10px;
      letter-spacing: 0.06em; color: rgba(0,0,0,0.22);
      transition: color 0.15s; position: relative;
    }
    .pagination-item::after {
      content: ''; position: absolute; right: 0; top: 50%;
      transform: translateY(-50%); width: 1px; height: 9px;
      background: rgba(0,0,0,0.12);
    }
    .pagination-item:last-child::after { display: none; }
    .pagination-item:hover { color: rgba(0,0,0,0.5); }
    .pagination-item.active { color: #111; font-weight: 700; }
    .pagination-num { font-family: var(--font-en); font-size: 9px; opacity: 0.35; }

    /* トークスクリプト */
    .script-trigger { display: none; }
    .script-panel { display: none; }


    /* ============================================================
       TYPE 01: 表紙（COVER）
       白背景 / 大見出し左 / ロゴ左下 / ページ番号右下
    ============================================================ */
    .s-cover {
      height: 100%; padding: 6cqw 7cqw;
      display: flex; flex-direction: column;
      justify-content: space-between; position: relative;
    }
    .s-cover-top { flex-shrink: 0; }
    .s-cover-main {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 0.6cqw;
    }
    .s-cover-client {
      font-family: var(--font-ja); font-size: 1.5cqw;
      font-weight: 550; color: var(--c-sub); letter-spacing: 0.05em;
    }
    .s-cover-title {
      font-family: var(--font-ja); font-size: 3.6cqw;
      font-weight: 900; line-height: 1.2; letter-spacing: 0.04em;
    }
    .s-cover-sub {
      font-family: var(--font-en); font-size: 1.35cqw;
      font-weight: 550; color: var(--c-sub); letter-spacing: 0.1em;
    }
    .s-cover-footer {
      flex-shrink: 0; display: flex; flex-direction: column;
      align-items: flex-start; gap: 1.2cqw;
    }


    /* ============================================================
       TYPE 02: 目次（AGENDA）
       番号 / セクション名 / 点線 / ページ番号
    ============================================================ */
    .s-agenda {
      height: 100%; padding: 4cqw 5cqw 5cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-agenda-top { flex-shrink: 0; margin-bottom: 3cqw; }
    .s-agenda-title {
      font-family: var(--font-ja); font-size: 1.3cqw;
      font-weight: 700; letter-spacing: 0.08em; color: var(--c-text);
      margin-bottom: 1cqw;
    }
    .s-agenda-rule { width: 2cqw; height: 2px; background: var(--c-black); }
    .s-agenda-list { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0; }
    .s-agenda-item {
      display: grid; grid-template-columns: 5cqw 1fr auto;
      align-items: baseline; gap: 0;
      padding: 1.6cqw 0;
      border-bottom: 1px solid var(--c-border);
    }
    .s-agenda-item:first-child { border-top: 1px solid var(--c-border); }
    .s-agenda-num {
      font-family: var(--font-en); font-size: 2.4cqw;
      font-weight: 500; color: var(--c-text); letter-spacing: -0.02em;
      line-height: 1;
    }
    .s-agenda-info { display: flex; flex-direction: column; gap: 0.3cqw; padding-left: 1cqw; }
    .s-agenda-name {
      font-family: var(--font-ja); font-size: 1.3cqw;
      font-weight: 700; color: var(--c-text); letter-spacing: 0.04em;
    }
    .s-agenda-desc {
      font-family: var(--font-ja); font-size: 0.9cqw;
      color: var(--c-sub); letter-spacing: 0.03em;
    }
    .s-agenda-pg {
      font-family: var(--font-en); font-size: 1.0cqw;
      color: var(--c-sub); letter-spacing: 0.05em;
      padding-bottom: 0.2cqw;
    }


    /* ============================================================
       TYPE 03: セクション区切り（SECTION BREAK）
       大番号左 / 線 / セクション名と説明 右
    ============================================================ */
    .s-section {
      height: 100%; padding: 4cqw 5cqw 5cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-section-top { flex-shrink: 0; }
    .s-section-main {
      flex: 1; display: flex; align-items: center; gap: 0;
    }
    .s-section-num-col { flex: 0 0 auto; }
    .s-section-big-num {
      font-family: var(--font-en); font-size: 18cqw;
      font-weight: 500; line-height: 1; letter-spacing: -0.04em;
      color: var(--c-light);
    }
    .s-section-divider {
      width: 1px; height: 14cqw;
      background: var(--c-border); flex-shrink: 0; margin: 0 4cqw;
    }
    .s-section-text-col {
      flex: 1; display: flex; flex-direction: column; gap: 1.6cqw;
    }
    .s-section-label {
      font-family: var(--font-en); font-size: 0.85cqw;
      letter-spacing: 0.18em; color: var(--c-sub);
    }
    .s-section-name {
      font-family: var(--font-ja); font-size: 3.8cqw;
      font-weight: 900; letter-spacing: 0.04em; line-height: 1.3;
    }
    .s-section-desc {
      font-family: var(--font-ja); font-size: 1.2cqw;
      font-weight: 500; color: var(--c-sub); line-height: 1.9;
      max-width: 38cqw;
    }


    /* ============================================================
       TYPE 04: ステートメント（STATEMENT）
       大見出し中央 / サブテキスト
    ============================================================ */
    .s-stmt {
      height: 100%; padding: 4cqw 5cqw 5cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-stmt-top { flex-shrink: 0; }
    .s-stmt-main {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 2.8cqw;
    }
    .s-stmt-heading {
      font-family: var(--font-ja); font-size: 4.8cqw;
      font-weight: 900; line-height: 1.4; letter-spacing: 0.04em;
    }
    .s-stmt-body {
      font-family: var(--font-ja); font-size: 1.4cqw;
      font-weight: 500; line-height: 1.95; color: var(--c-sub);
      max-width: 52cqw;
    }


    /* ============================================================
       TYPE 05: テキスト＋リスト（TEXT + LIST）
       左見出し / 右リスト
    ============================================================ */
    .s-list {
      height: 100%; padding: 4cqw 5cqw 5cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-list-top { flex-shrink: 0; }
    .s-list-main {
      flex: 1; display: flex; align-items: center; gap: 6cqw;
    }
    .s-list-left { flex: 0 0 26cqw; }
    .s-list-heading {
      font-family: var(--font-ja); font-size: 3cqw;
      font-weight: 900; line-height: 1.45; letter-spacing: 0.04em;
    }
    .s-list-right { flex: 1; }
    .s-list-items { list-style: none; }
    .s-list-item {
      display: grid; grid-template-columns: 3.5cqw 14cqw 1fr;
      align-items: baseline; gap: 1.2cqw;
      padding: 1.2cqw 0;
      border-bottom: 1px solid var(--c-border);
    }
    .s-list-item:first-child { border-top: 1px solid var(--c-border); }
    .s-list-num {
      font-family: var(--font-en); font-size: 0.8cqw;
      color: var(--c-sub); letter-spacing: 0.06em;
    }
    .s-list-name {
      font-family: var(--font-ja); font-size: 1.2cqw; font-weight: 700;
      letter-spacing: 0.03em;
    }
    .s-list-desc {
      font-family: var(--font-ja); font-size: 1.05cqw;
      color: var(--c-sub); line-height: 1.7;
    }


    /* ============================================================
       TYPE 06: 特徴グリッド（FEATURE GRID）
       見出し上 / アイコン円＋テキスト 4列
    ============================================================ */
    .s-feature {
      height: 100%; padding: 4cqw 5cqw 5cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-feature-top { flex-shrink: 0; }
    .s-feature-headline {
      font-family: var(--font-ja); font-size: 2.2cqw;
      font-weight: 900; letter-spacing: 0.04em; margin-bottom: 4cqw;
      text-align: center;
    }
    .s-feature-grid {
      flex: 1; display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 2cqw; align-items: start;
    }
    .s-feature-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 1.2cqw; text-align: center;
    }
    .s-feature-icon {
      width: 6cqw; height: 6cqw; border-radius: 50%;
      background: var(--c-black);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .s-feature-icon svg { width: 2.4cqw; height: 2.4cqw; fill: #fff; }
    .s-feature-name {
      font-family: var(--font-ja); font-size: 1.2cqw;
      font-weight: 700; letter-spacing: 0.04em;
    }
    .s-feature-desc {
      font-family: var(--font-ja); font-size: 1.0cqw;
      color: var(--c-sub); line-height: 1.8;
    }


    /* ============================================================
       TYPE 07: NUMBER（黒背景・大数字）
    ============================================================ */
    .s-number {
      height: 100%; padding: 4cqw 5cqw 5cqw;
      display: flex; flex-direction: column;
      background: var(--c-black); position: relative;
    }
    .s-number-top { flex-shrink: 0; }
    .s-number-grid {
      flex: 1; display: flex; align-items: center;
    }
    .s-number-item {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 1.2cqw;
      padding: 0 3.5cqw;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .s-number-item:first-child { padding-left: 0; }
    .s-number-item:last-child { border-right: none; }
    .s-number-label {
      font-family: var(--font-en); font-size: 0.85cqw;
      letter-spacing: 0.18em; color: rgba(255,255,255,0.28);
    }
    .s-number-num-row { display: flex; align-items: baseline; gap: 0.4cqw; }
    .s-number-num {
      font-family: var(--font-en); font-size: 9cqw;
      font-weight: 500; line-height: 1; letter-spacing: -0.04em; color: #fff;
    }
    .s-number-unit {
      font-family: var(--font-ja); font-size: 2.4cqw;
      font-weight: 700; color: rgba(255,255,255,0.4);
    }
    .s-number-desc {
      font-family: var(--font-ja); font-size: 1.1cqw;
      line-height: 1.8; color: rgba(255,255,255,0.38);
    }


    /* ============================================================
       TYPE 08: 会社概要テーブル（OVERVIEW）
    ============================================================ */
    .s-overview {
      height: 100%; padding: 4cqw 5cqw 5cqw;
      display: flex; flex-direction: column; position: relative;
    }
    .s-overview-top { flex-shrink: 0; }
    .s-overview-main {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 2cqw;
    }
    .s-overview-logo { height: 1.8cqw; width: auto; display: block; }
    .s-overview-logo-text {
      font-family: var(--font-en); font-size: 2.4cqw;
      font-weight: 500; letter-spacing: 0.1em;
    }
    .s-overview-table { width: 100%; border-collapse: collapse; }
    .s-overview-table tr { border-bottom: 1px solid var(--c-border); }
    .s-overview-table tr:last-child { border-bottom: none; }
    .s-overview-table th {
      text-align: left; width: 12cqw; padding: 0.9cqw 0;
      font-family: var(--font-ja); font-size: 0.95cqw;
      font-weight: 500; color: var(--c-sub); vertical-align: middle;
    }
    .s-overview-table td {
      padding: 0.9cqw 0 0.9cqw 2cqw;
      font-family: var(--font-ja); font-size: 1.15cqw;
      font-weight: 500; line-height: 1.6;
    }

  </style>
</head>
<body>

<div class="slide-stage" id="slide-stage"></div>
<div class="nav-prev" id="nav-prev"></div>
<div class="nav-next" id="nav-next"></div>
<div class="status-bar" id="status-bar"></div>
<button class="menu-btn" id="menu-btn"><span></span><span></span><span></span></button>
<div class="progress-bar" id="progress-bar" style="width:0"></div>

<div class="sidebar-overlay" id="sidebar-overlay">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">CRATER</span>
      <button class="sidebar-close" id="sidebar-close">✕</button>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
  </nav>
</div>

<nav class="pagination" id="pagination"></nav>
<div class="script-trigger" id="script-trigger"></div>
<div class="script-panel" id="script-panel"></div>

<script>
// ============================================================
// SLIDES
// ============================================================

function slide01Cover() {
  return `<section class="slide" data-section="cover" data-notes="本日はお時間をいただきありがとうございます。株式会社クレーターの会社概要をご覧ください。">
  <div class="s-cover">
    <div class="s-cover-top"></div>
    <div class="s-cover-main">
      <p class="s-cover-client">○○株式会社 御中</p>
      <h1 class="s-cover-title">会社概要</h1>
      <p class="s-cover-sub">Vol.01</p>
    </div>
    <div class="s-cover-footer">
      <img src="assets/logo.svg" alt="CRATER" style="height:1.4cqw;width:auto;">
      <span class="logo-footer-copy">©CRATER Inc.</span>
    </div>
  </div>
</section>`;
}

function slide02Agenda() {
  return `<section class="slide" data-section="agenda" data-notes="本日の流れをご説明します。コンセプト・サービス・実績・会社概要の順でご紹介します。">
  <div class="s-agenda">
    <div class="s-agenda-top">
      <p class="s-agenda-title">目次</p>
      <div class="s-agenda-rule"></div>
    </div>
    <div class="s-agenda-list">
      <div class="s-agenda-item">
        <span class="s-agenda-num">01</span>
        <div class="s-agenda-info">
          <span class="s-agenda-name">コンセプト</span>
          <span class="s-agenda-desc">クレーターの考え方と使命</span>
        </div>
        <span class="s-agenda-pg">03</span>
      </div>
      <div class="s-agenda-item">
        <span class="s-agenda-num">02</span>
        <div class="s-agenda-info">
          <span class="s-agenda-name">サービス</span>
          <span class="s-agenda-desc">提供できるデザインの領域</span>
        </div>
        <span class="s-agenda-pg">06</span>
      </div>
      <div class="s-agenda-item">
        <span class="s-agenda-num">03</span>
        <div class="s-agenda-info">
          <span class="s-agenda-name">実績</span>
          <span class="s-agenda-desc">数字で見るクレーターの信頼</span>
        </div>
        <span class="s-agenda-pg">09</span>
      </div>
      <div class="s-agenda-item">
        <span class="s-agenda-num">04</span>
        <div class="s-agenda-info">
          <span class="s-agenda-name">会社概要</span>
          <span class="s-agenda-desc">基本情報</span>
        </div>
        <span class="s-agenda-pg">12</span>
      </div>
    </div>
    <div class="logo-footer">
      <img src="assets/logo.svg" alt="CRATER">
      <span class="logo-footer-copy">©CRATER Inc.</span>
    </div>
    <div class="pg-num">02</div>
  </div>
</section>`;

<script>
(function () {
  var stage       = document.getElementById('slide-stage');
  var statusBar   = document.getElementById('status-bar');
  var menuBtn     = document.getElementById('menu-btn');
  var overlay     = document.getElementById('sidebar-overlay');
  var sideClose   = document.getElementById('sidebar-close');
  var sideList    = document.getElementById('sidebar-list');
  var progress    = document.getElementById('progress-bar');
  var navPrev     = document.getElementById('nav-prev');
  var navNext     = document.getElementById('nav-next');
  var scriptTrig  = document.getElementById('script-trigger');
  var scriptPanel = document.getElementById('script-panel');
  var pagination  = document.getElementById('pagination');
  var current = 0;
  var total   = slideFactories.length;
  var rendered = {};
  var currentScale = 1;

  function scaleSlides() {
    currentScale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.querySelectorAll('.slide').forEach(function (s) {
      s.style.transform = 'translate(-50%, -50%) scale(' + currentScale + ')';
    });
  }
  window.addEventListener('resize', scaleSlides);

  function ensureRendered(i) {
    if (rendered[i] || i < 0 || i >= total) return;
    var frag = document.createRange().createContextualFragment(slideFactories[i]());
    stage.appendChild(frag);
    rendered[i] = true;
    scaleSlides();
  }

  function goTo(i, skipHash) {
    if (i < 0 || i >= total) return;
    [i - 1, i, i + 1].forEach(function (j) { ensureRendered(j); });
    var slides = stage.querySelectorAll('.slide');
    slides.forEach(function (s) { s.classList.remove('active'); });
    if (slides[i]) slides[i].classList.add('active');
    current = i;
    if (!skipHash) history.replaceState(null, '', '#' + (i + 1));
    statusBar.textContent = agendaItems[i].label + '  ' + (i + 1) + ' / ' + total;
    progress.style.width = ((i + 1) / total * 100) + '%';
    document.querySelectorAll('.sidebar-item').forEach(function (el, idx) {
      el.classList.toggle('active', idx === i);
    });
    document.querySelectorAll('.pagination-item').forEach(function (el, idx) {
      el.classList.toggle('active', idx === i);
    });
    var slide = slides[i];
  }

  var initPage = 0;
  var hash = window.location.hash.replace('#', '');
  if (hash && !isNaN(hash)) {
    var p = parseInt(hash, 10) - 1;
    if (p >= 0 && p < total) initPage = p;
  }
  scaleSlides();
  [0, 1, 2].forEach(function (i) { ensureRendered(i); });
  goTo(initPage, true);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ')         { e.preventDefault(); goTo(current + 1); }
    if (e.key === 'ArrowLeft'  || e.key === 'Backspace') { e.preventDefault(); goTo(current - 1); }
    if (e.key === 'Home')  { e.preventDefault(); goTo(0); }
    if (e.key === 'End')   { e.preventDefault(); goTo(total - 1); }
    if (e.key === 'Escape') { overlay.classList.remove('open'); }
  });
  navPrev.addEventListener('click', function () { goTo(current - 1); });
  navNext.addEventListener('click', function () { goTo(current + 1); });
  menuBtn.addEventListener('click', function () { overlay.classList.toggle('open'); });
  sideClose.addEventListener('click', function () { overlay.classList.remove('open'); });
  overlay.addEventListener('click', function (e) {
    if (!e.target.closest('.sidebar')) overlay.classList.remove('open');
  });

  agendaItems.forEach(function (item, i) {
    var btn = document.createElement('button');
    btn.className = 'sidebar-item';
    btn.innerHTML = '<span class="sidebar-num">' + String(i + 1).padStart(2, '0') + '</span><span>' + item.label + '</span>';
    btn.addEventListener('click', function (e) { e.stopPropagation(); goTo(i); overlay.classList.remove('open'); });
    sideList.appendChild(btn);

    var pBtn = document.createElement('button');
    pBtn.className = 'pagination-item';
    pBtn.innerHTML = '<span class="pagination-num">' + String(i + 1).padStart(2, '0') + '</span><span>' + item.label + '</span>';
    pBtn.addEventListener('click', function (e) { e.stopPropagation(); goTo(i); });
    pagination.appendChild(pBtn);
  });

})();
</script>
