      <text class="cls-7" transform="translate(164.8 -72.1)"><tspan x="0" y="0">A CURRY</tspan></text>
      <line class="cls-11" x1="56.7" y1="261.7" x2="538.6" y2="261.7"/>
      <text class="cls-3" transform="translate(193.2 288.3)"><tspan x="0" y="0">記憶に残る、この一皿。</tspan></text>
      <text class="cls-4" transform="translate(262.4 242.8)"><tspan x="0" y="0">ア カリー</tspan></text>
      <line class="cls-11" x1="56.7" y1="302.5" x2="538.6" y2="302.5"/>
      <text class="cls-5" transform="translate(493.8 327.5)"><tspan x="0" y="0">2026年5月</tspan></text>
      <text class="cls-6" transform="translate(58.8 353.9)"><tspan x="0" y="0">鋤田様よりご紹介いただき、ご連絡させていただきました。</tspan><tspan x="0" y="25.1">株式会社クレーターの明里（あかり）と申します。</tspan><tspan x="0" y="75.3">このたびは A CURRY のサンプルをお受け取りいただき、誠にありがとうございます。</tspan><tspan x="0" y="125.5">「肉じゃがカレー」は、国産素材と 32 種のスパイス、</tspan><tspan x="0" y="150.6">直火焙煎のルウが織りなす、懐かしくも新しい一皿です。</tspan><tspan x="0" y="200.9">温めてそのままお召し上がりいただき、</tspan><tspan x="0" y="226">率直なご感想をいただけますと幸いです。</tspan><tspan x="0" y="276.2">なお、まだ公表前ではございますが、この夏、新たに 2 種のフレーバーを追加予定です。</tspan><tspan x="0" y="301.3">ご一緒できる施策がございましたら、ぜひご相談させてください。</tspan><tspan x="0" y="351.5">どうぞよろしくお願いいたします。</tspan></text>
      <text class="cls-2" transform="translate(462.1 748.3)"><tspan x="0" y="0">株式会社</tspan><tspan x="34" y="0">ク</tspan><tspan x="42.5" y="0">レ</tspan><tspan x="51" y="0">ー</tspan><tspan x="59.5" y="0">タ</tspan><tspan x="68" y="0">ー</tspan></text>
